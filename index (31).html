  /* the Background picker (Settings > Background) */
  function openBackground() {
    const tiles = () => Object.keys(BGS).map((k) => `<button type="button" class="bg-tile bg-${k}${bgGet() === k ? ' on' : ''}" data-bg="${k}" aria-pressed="${bgGet() === k}">
        <span class="bg-prev"${k === 'photo' && bgPhoto() ? ` style="background-image:url('${bgPhoto().replace(/'/g, '%27')}')"` : ''}>${k === 'photo' && !bgPhoto() ? '<b>+</b>' : ''}</span><span class="bg-name">${BGS[k]}</span></button>`).join('');
    dialog({ title: 'Background', ok: 'Done', cancel: '', body: `<div class="bg-pick"><div class="bg-grid">${tiles()}</div>
      <input type="file" id="bgFile" accept="image/*" hidden>
      <p class="st-note">Your picture stays on this device only. ${bgPhoto() ? '<button type="button" class="bg-del" data-bg-del>Remove my picture</button>' : ''}</p></div>` });
    setTimeout(() => {
      const box = document.querySelector('.vx-dialog'); if (!box) return;
      const repaint = () => { const g = box.querySelector('.bg-grid'); if (g) g.innerHTML = tiles(); };
      box.addEventListener('click', (e) => {
        const t = e.target.closest('[data-bg]');
        if (t) {
          if (t.dataset.bg === 'photo') { box.querySelector('#bgFile').click(); return; }
          setBackground(t.dataset.bg); repaint(); return;
        }
        if (e.target.closest('[data-bg-del]')) { try { localStorage.removeItem(BG_PHOTO); } catch (x) {} if (bgGet() === 'photo') setBackground('stars'); repaint(); e.target.remove(); toast('Picture removed'); }
      });
      box.querySelector('#bgFile').addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        if (!/^image\//.test(f.type)) { toast('Pick a picture file'); return; }
        const img = new Image(), url = URL.createObjectURL(f);
        img.onload = () => {
          // shrink big photos so they fit in the browser's storage
          const max = 1920, sc = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
          let data = cv.toDataURL('image/jpeg', .82);
          if (data.length > 3500000) data = cv.toDataURL('image/jpeg', .6);
          try { localStorage.setItem(BG_PHOTO, data); } catch (x) { toast('That picture is too big to save. Try a smaller one.'); return; }
          setBackground('photo'); repaint(); toast('Background set to your picture');
        };
        img.onerror = () => { URL.revokeObjectURL(url); toast("Couldn't open that picture"); };
        img.src = url;
      });
    }, 0);
  }

  /* ---------------- Movies tab: "coming soon" popup with a live countdown ---------------- */
  function moviesCountdown() {
    const at = Date.parse(window.VEXO_MOVIES_AT || '');
    const parts = () => {
      let s = Math.max(0, Math.floor((at - Date.now()) / 1000));
      const d = Math.floor(s / 86400); s %= 86400; const h = Math.floor(s / 3600); s %= 3600; const m = Math.floor(s / 60); s %= 60;
      return [[d, 'DAYS'], [h, 'HOURS'], [m, 'MIN'], [s, 'SEC']];
    };
    const clock = () => parts().map(([n, u]) => `<span class="mv-seg"><b>${String(n).padStart(2, '0')}</b><small>${u}</small></span>`).join('');
    const ready = () => isNaN(at) || Date.now() >= at;
    dialog({ title: 'Movies', ok: 'OK', cancel: '', body: `<div class="mv-box">
      <p class="mv-lead" id="mvLead">${ready() ? 'Movies are coming very soon. Check back shortly.' : 'Movies are coming soon. They open in:'}</p>
      ${ready() ? '' : `<div class="mv-clock" id="mvClock" role="timer">${clock()}</div>`}
      ${window.VexoTrailer ? `<button type="button" class="mv-trailer" data-trailer><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>Watch the early release trailer</button>` : ''}</div>` });
    const t = setInterval(() => {
      const el = document.getElementById('mvClock');
      if (!el) { clearInterval(t); return; }
      if (ready()) { el.remove(); document.getElementById('mvLead').textContent = 'Movies are coming very soon. Check back shortly.'; clearInterval(t); return; }
      el.innerHTML = clock();
    }, 1000);
  }

    if (window.VexoMovies && window.VexoHub) location.hash = '#/movies';
    else if (!window.VexoHub) location.href = HOME() + '#/movies';

<script>
/* Vexo - Levels, XP, badges and the Game of the Day.
   Everything is saved in this browser (no account).
   XP comes from: visiting each day (bigger bonus for streaks), playing games (more for new ones and the

   Other parts of the site tell this file what happened with events like "vexo:play" and "vexo:music". */
(function () {
  'use strict';

  const KEY = 'vexo_progress';

  /* ---------- dates ---------- */
  const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = () => ymd(new Date());
  const dateOf = (x) => { const [y, m, d] = String(x).split('-').map(Number); return new Date(y, m - 1, d); };
  const dayNum = (s) => { const [y, m, d] = String(s).split('-').map(Number); return Math.round(new Date(y, m - 1, d).getTime() / 86400000); };

  /* ---------- saved progress ---------- */
  const blank = () => ({ xp: 0, lastDay: '', streak: 0, best: 0, visits: 0, plays: 0, games: [], songs: 0, ai: 0, searches: 0, reminders: 0, gotd: 0, custom: 0, badges: {}, daily: {} });

  const levelOf = (xp) => { let lv = 1; while (xp >= need(lv + 1)) lv++; return lv; };
  const RANKS = [[1, 'Rookie'], [3, 'Player'], [5, 'Pro'], [8, 'Elite'], [12, 'Legend'], [20, 'Mythic']];
  const rank = (lv) => RANKS.filter(([n]) => lv >= n).pop()[1];

  /* ---------- badges ---------- */
  const I = {

    bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
    flame: '<path d="M12 22c4 0 7-2.8 7-6.8 0-3.4-2.4-5.6-3.8-7.6-.4 1.8-1.4 3-2.6 3.6.4-3.4-1.2-6.6-4.1-8.2.2 3.4-1.7 5.6-3.2 7.6C4.2 12.6 5 14 5 15.2 5 19.2 8 22 12 22z"/>',

    brush: '<path d="M14 4l6 6-8.5 8.5a3 3 0 01-4.2 0l-1.8-1.8a3 3 0 010-4.2z"/><path d="M4 20c1.5 0 3-.5 3-2"/>',
    trophy: '<path d="M8 4h8v5a4 4 0 01-8 0z"/><path d="M8 6H5a3 3 0 003 4M16 6h3a3 3 0 01-3 4M12 13v4M8 21h8M9 17h6"/>',

    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
  };
  const svg = (k) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;
  const BADGES = [
    { id: 'first-game', icon: 'pad', name: 'First Game', how: 'Play your first game', n: () => s.plays, goal: 1 },
    { id: 'explorer', icon: 'compass', name: 'Explorer', how: 'Play 10 different games', n: () => s.games.length, goal: 10 },
    { id: 'collector', icon: 'stack', name: 'Collector', how: 'Play 25 different games', n: () => s.games.length, goal: 25 },
    { id: 'marathon', icon: 'bolt', name: 'Marathon', how: 'Start 100 games', n: () => s.plays, goal: 100 },
    { id: 'daily-pick', icon: 'star', name: 'Daily Pick', how: 'Play the Game of the Day', n: () => s.gotd, goal: 1 },
    { id: 'daily-pick-7', icon: 'sun', name: 'Pick Pro', how: 'Play the Game of the Day 7 times', n: () => s.gotd, goal: 7 },
    { id: 'streak-3', icon: 'flame', name: '3-Day Streak', how: 'Visit Vexo 3 days in a row', n: () => s.best, goal: 3 },
    { id: 'streak-7', icon: 'flame', name: '7-Day Streak', how: 'Visit Vexo 7 days in a row', n: () => s.best, goal: 7 },
    { id: 'streak-30', icon: 'flame', name: '30-Day Streak', how: 'Visit Vexo 30 days in a row', n: () => s.best, goal: 30 },
    { id: 'dj', icon: 'note', name: 'DJ', how: 'Play 10 songs', n: () => s.songs, goal: 10 },
    { id: 'music-lover', icon: 'phones', name: 'Music Lover', how: 'Play 50 songs', n: () => s.songs, goal: 50 },
    { id: 'curious', icon: 'spark', name: 'Curious Mind', how: 'Ask Vexo AI 10 questions', n: () => s.ai, goal: 10 },
    { id: 'searcher', icon: 'search', name: 'Searcher', how: 'Do 10 searches in Vexo Search', n: () => s.searches, goal: 10 },
    { id: 'movie-buff', icon: 'bell', name: 'Movie Buff', how: 'Set 3 movie reminders', n: () => s.reminders, goal: 3 },
    { id: 'stylist', icon: 'brush', name: 'Stylist', how: 'Change your background or cursor', n: () => s.custom, goal: 1 },
    { id: 'level-5', icon: 'trophy', name: 'Level 5', how: 'Reach level 5', n: () => levelOf(s.xp), goal: 5 },
    { id: 'level-10', icon: 'crown', name: 'Level 10', how: 'Reach level 10', n: () => levelOf(s.xp), goal: 10 },
    { id: 'level-20', icon: 'gem', name: 'Level 20', how: 'Reach level 20', n: () => levelOf(s.xp), goal: 20 }
  ];

  /* ---------- popups ---------- */
  const queue = []; let showing = false;
  function pop(html) {
    queue.push(html); if (showing) return;
    const next = () => {
      const h = queue.shift(); if (!h) { showing = false; return; }
      showing = true;
      const el = document.createElement('div'); el.className = 'xp-pop'; el.setAttribute('role', 'status'); el.innerHTML = h;
      document.body.appendChild(el);

  let floatT = 0;

    el.textContent = '+' + n + ' XP'; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');

  }
  function checkBadges(quiet) {

  }

  /* ---------- Game of the Day: the same pick for everyone, new every day ---------- */
  function gotd(dateStr) {
    const list = Store.games().filter((g) => !g.external).sort((a, b) => (a.id < b.id ? -1 : 1));
    const pool = list.length ? list : Store.games(); if (!pool.length) return null;
    let h = 2166136261; for (const ch of String(dateStr || today())) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
    return pool[(h >>> 0) % pool.length];
  }
  function nextPickIn() {
    const n = new Date(); const t = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n;

      <h2 class="me-h">How to earn XP</h2>
      <ul class="me-how">
        <li><b>+25</b> for visiting each day, plus up to <b>+50</b> more for your streak</li>

    function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
    function wrap(s, maxW) { const words = s.split(' '), lines = []; let line = ''; for (const w of words) { const tst = line ? line + ' ' + w : w; if (ctx.measureText(tst).width > maxW && line) { lines.push(line); line = w; } else line = tst; } if (line) lines.push(line); return lines; }
    function bubble(s, t, at, right, y, typing) {
      if (t < at) return;
      const k = reduce ? 1 : Math.min(1, (t - at) / 0.25), sc = 0.6 + 0.4 * (1 - Math.pow(1 - k, 3));
      const px = Math.round(Math.min(W * 0.035, 24) + 4);
      ctx.save(); ctx.font = `600 ${px}px ${SANS}`; ls('0px');
      const maxW = Math.min(W * 0.62, 520), lines = typing ? [''] : wrap(s, maxW - px * 1.6);
      const w = typing ? px * 3.6 : Math.max(...lines.map((l) => ctx.measureText(l).width)) + px * 1.6, h = lines.length * px * 1.35 + px * 1.1;
      const x = right ? W / 2 + Math.min(W * 0.3, 300) - w : W / 2 - Math.min(W * 0.3, 300);
      ctx.globalAlpha = k; ctx.translate(x + (right ? w : 0), y); ctx.scale(sc, sc); ctx.translate(-(right ? w : 0), 0);
      rr(0, 0, w, h, px * 0.9); ctx.fillStyle = right ? '#fff' : '#1b1b1b'; ctx.fill();
      if (!right) { ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke(); }
      ctx.fillStyle = right ? '#000' : '#fff'; ctx.textBaseline = 'top';
      if (typing) { for (let i = 0; i < 3; i++) { ctx.globalAlpha = k * (0.35 + 0.65 * Math.max(0, Math.sin(t * 9 - i * 0.9))); ctx.beginPath(); ctx.arc(px * 1.0 + i * px * 0.8, h / 2, px * 0.2, 0, 7); ctx.fill(); } }
      else lines.forEach((l, i) => ctx.fillText(l, px * 0.8, px * 0.55 + i * px * 1.35));
      ctx.restore();
      return h;
    }
    function drawStars(t, dt) {
      const v = reduce ? Math.min(speed(t), 0.3) : speed(t), f = Math.min(W, H) * 0.6, cx = W / 2, cy = H / 2, intro = Math.min(1, t / 2.5);
      ctx.lineCap = 'round';
      for (const s of stars) {
        const z0 = s.z; s.z -= v * dt;
        if (s.z <= 0.02) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = 1; continue; }
        const x1 = cx + (s.x / s.z) * f, y1 = cy + (s.y / s.z) * f;
        if (x1 < -50 || x1 > W + 50 || y1 < -50 || y1 > H + 50) { s.z = 1; s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; continue; }
        const zb = Math.min(1, z0 + v * 0.02), x0 = cx + (s.x / zb) * f, y0 = cy + (s.y / zb) * f;
        ctx.strokeStyle = `rgba(255,255,255,${Math.min(1, (1 - s.z) * 1.3) * intro})`; ctx.lineWidth = Math.max(0.6, (1 - s.z) * 2.6);
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 + 0.1, y1 + 0.1); ctx.stroke();
      }
    }

    /* the scenes */
    function sceneGames(t) { // 9 - 14: three rows of real game cards sliding past, and a game counter
      const a = 9, b = 14; if (t < a - 0.2 || t > b) return;
      const al = fade(t, a - 0.2, b, 0.3), cw = Math.max(150, Math.min(W * 0.2, 260)), ch = cw * 0.62, gap = cw * 0.12;
      ctx.save(); ctx.globalAlpha = al * 0.9; ctx.translate(W / 2, H / 2); ctx.rotate(reduce ? 0 : -0.12); ctx.translate(-W / 2, -H / 2);
      for (let row = 0; row < 3; row++) {
        const y = H / 2 + (row - 1) * (ch + gap) - ch / 2, dir = row % 2 ? 1 : -1, sp = (reduce ? 40 : 160 + row * 40) * (1 + pulse(t) * 0.4);
        const off = ((t - a) * sp * dir) % ((cw + gap) * 8);
        for (let i = -2; i < 12; i++) {
          const g = games[(row * 8 + ((i % 8) + 8) % 8) % Math.max(1, games.length)]; if (!g) continue;
          const x = i * (cw + gap) + off - (cw + gap) * 2 + (row === 1 ? cw / 2 : 0);
          ctx.save(); rr(x, y, cw, ch, 14); ctx.fillStyle = '#151515'; ctx.fill(); ctx.clip();
          if (g.img.complete && g.img.naturalWidth) ctx.drawImage(g.img, x, y, cw, ch);
          else { ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(cw * 0.09)}px ${SANS}`; ls('0px'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(g.title.slice(0, 18), x + cw / 2, y + ch / 2); }
          ctx.restore();
        }
      }
      ctx.restore();
      // dark band so the words read over the cards
      ctx.save(); ctx.globalAlpha = al * 0.78; ctx.fillStyle = '#000'; ctx.fillRect(0, H / 2 - H * 0.13, W, H * 0.26); ctx.restore();
      const n = Math.round(gameCount * Math.min(1, Math.max(0, (t - a) / 1.4)));
      text(n + ' GAMES', t, a, b, { size: 0.09, ls: 0.06, beat: true });
      text('NO DOWNLOADS. NO ACCOUNT. NO WAITING.', t, a + 1.6, b, { size: 0.022, ls: 0.4, dy: 0.085, dim: true });
    }
    function sceneMusic(t) { // 14 - 18: equalizer bars bouncing to the beat
      const a = 14, b = 18; if (t < a || t > b) return;
      const al = fade(t, a, b, 0.3), n = Math.max(16, Math.min(40, Math.floor(W / 30))), bw = W / n;
      ctx.save(); ctx.globalAlpha = al;
      for (let i = 0; i < n; i++) {
        const wob = 0.5 + 0.5 * Math.sin(t * 7 + i * 0.7) * Math.sin(t * 3.3 + i * 1.9);
        const h = H * (0.08 + 0.42 * wob * (0.45 + pulse(t) * 0.75) * (1 - Math.abs(i - n / 2) / n));
        ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.55 * wob})`; rr(i * bw + bw * 0.18, H - h - H * 0.1, bw * 0.64, h, Math.min(6, bw * 0.3)); ctx.fill();
      }
      ctx.restore();
      text('MUSIC THAT ACTUALLY SLAPS', t, a, b, { size: 0.065, ls: 0.06, dy: -0.12, beat: true, pop: true });
      text('SPOTIFY  ·  YOUTUBE  ·  YOUR OWN PLAYLISTS', t, a + 0.8, b, { size: 0.02, ls: 0.4, dy: -0.04, dim: true });
    }
    function sceneAI(t) { // 18 - 23: a funny Vexo AI chat
      const a = 18, b = 23; if (t < a || t > b) return;
      ctx.save(); ctx.globalAlpha = fade(t, a, b, 0.3);
      const y0 = H * 0.3;
      bubble('can u just do my homework', t, a + 0.3, true, y0);
      if (t > a + 1.3 && t < a + 2.4) bubble('', t, a + 1.3, false, y0 + H * 0.13, true);
      if (t >= a + 2.4) bubble("Nice try. I'll help you actually get it though.", t, a + 2.4, false, y0 + H * 0.13);
      ctx.restore();
      text('VEXO AI', t, a + 3.4, b, { size: 0.06, ls: 0.3, dy: 0.25, pop: true, beat: true });
      text('SMARTER THAN YOUR GROUP CHAT', t, a + 3.7, b, { size: 0.02, ls: 0.4, dy: 0.32, dim: true });
    }
    function sceneReviews(t) { // 23 - 27: joke reviews pop in on the beat
      const a = 23, b = 27; if (t < a || t > b) return;
      const R = [
        ['"Better than recess."', '- a kid in 3rd period'],
        ['"I told my dog about it."', '- some guy named Kevin'],
        ['"Needs more snacks."', '- the cafeteria']
      ];
      R.forEach((r, i) => {
        const at = a + i * BEAT * 2.5, y = -0.22 + i * 0.22;
        text('★★★★★', t, at, b, { size: 0.03, ls: 0.3, dy: y - 0.065, pop: true, color: '#fff' });
        text(r[0], t, at, b, { size: 0.05, ls: 0.01, dy: y, pop: true, weight: 800 });
        text(r[1], t, at + 0.2, b, { size: 0.022, ls: 0.15, dy: y + 0.055, dim: true, weight: 600 });
      });
    }
    function sceneTitle(t, cx, cy) { // the big title, right after the drop
      if (t < DROP2 || t >= MONT_A) return;
      const p = t - DROP2, al = Math.min(1, (MONT_A - t) / 0.25);
      const slam = reduce ? 1 : (1 + 0.9 * Math.exp(-p * 9)) * (1 + pulse(t) * 0.035);
      const big = Math.round(Math.min(W * 0.26, H * 0.32));
      ctx.save(); ctx.globalAlpha = al; ctx.translate(cx, cy - big * 0.12); ctx.scale(slam, slam);
      ctx.font = `400 ${big}px ${SCRIPT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ls('0px');
      if (!reduce && p < 0.4) glitch('vexo', big * 0.05 * (1 - p / 0.4));
      ctx.fillStyle = '#fff'; ctx.fillText('vexo', 0, 0); ctx.restore();
      const st = Math.exp(-p * 1.6) * al;
      if (st > 0.02) { const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, `rgba(255,255,255,${0.75 * st})`); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, cy - big * 0.12 - 1, W, 2); }
      if (t > DROP2 + 0.9) {
        const q = Math.min(1, (t - DROP2 - 0.9) / 1.2), e = 1 - Math.pow(1 - q, 3), px = Math.round(Math.min(W * 0.05, H * 0.06));
        ctx.save(); ctx.globalAlpha = al * e; ctx.font = `800 ${px}px ${SANS}`; ls((px * (0.2 + 0.6 * e)).toFixed(1) + 'px');
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
        ctx.fillText('MOVIES', cx + px * 0.3 * e, cy + big * 0.42); ctx.restore();
      }
    }
    function sceneMontage(t) { // the next movies coming out, one slam every 2 beats
      if (t < MONT_A || t >= MONT_B) return;
      if (!movies.length) { text('NEW MOVIES', t, MONT_A, MONT_B, { size: 0.1, ls: 0.1, pop: true, beat: true }); return; }
      const k = Math.floor((t - MONT_A) / (2 * BEAT)), m = movies[k % movies.length];
      const a = MONT_A + k * 2 * BEAT, b = a + 2 * BEAT, p = (t - a) / (b - a);
      const d = new Date(relAt(m));
      // a giant outlined day number behind, drifting toward you
      const big = Math.round(Math.min(W, H) * 0.62);
      ctx.save(); ctx.globalAlpha = 0.16 * Math.min(1, (t - a) / 0.08); ctx.translate(W / 2 + (k % 2 ? 1 : -1) * W * 0.18, H / 2);
      ctx.scale(1 + p * 0.12, 1 + p * 0.12); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.font = `800 ${big}px ${SANS}`; ls('0px'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeText(String(d.getDate()), 0, 0); ctx.restore();

      ctx.save(); const bw = W * 0.5 * Math.min(1, (t - a) / 0.25); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(W / 2 - bw / 2, H / 2 + H * 0.075, bw, 2); ctx.restore();
      const when = d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase();
      text(when, t, a, b, { size: 0.022, ls: 0.45, dy: -0.09, f: 0.06, dim: true });
      text(m.title.toUpperCase(), t, a, b, { size: 0.062, ls: 0.04, f: 0.06, pop: true, glitch: true });
      text(inDays(m), t, a + 0.12, b, { size: 0.026, ls: 0.4, dy: 0.12, f: 0.06 });
    }
    function sceneEnd(t, cx, cy) {
      if (t < END - 0.4) return;
      const al = Math.min(1, (t - END + 0.4) / 0.8), big = Math.round(Math.min(W * 0.14, H * 0.18));
      ctx.save(); ctx.globalAlpha = al; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
      ctx.font = `400 ${big}px ${SCRIPT}`; ls('0px'); ctx.fillText('vexo', cx, cy - big * 0.75);
      const px = Math.round(big * 0.2); ctx.font = `800 ${px}px ${SANS}`; ls((px * 0.7).toFixed(1) + 'px');
      ctx.fillText('MOVIES', cx + px * 0.35, cy - big * 0.15); ctx.restore();
      // post-credits joke
      if (t > END + 4) {
        const k = Math.min(1, (t - END - 4) / 0.6), px2 = Math.round(Math.min(W * 0.032, 18));
        ctx.save(); ctx.globalAlpha = k * 0.7; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = `600 ${px2}px ${SANS}`; ls('0px');
        ctx.fillText("...you're still here? Go play a game.", cx, H - H * 0.06 - px2); ctx.restore();
      }
    }

    function draw(now) {
      const raw = (now - state.t0) / 1000, t = raw - LEAD;
      songTick(t);
      const dt = Math.min(0.05, (now - state.last) / 1000); state.last = now;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (raw < LEAD) { leader(raw); el.querySelector('.tr-prog i').style.width = Math.min(100, (raw / (END + LEAD)) * 100) + '%'; state.raf = requestAnimationFrame(draw); return; }
      let sx = 0, sy = 0;
      if (!reduce) {
        for (const b of BOOMS) if (t > b && t < b + 1) { const k = Math.exp(-(t - b) * 7) * (b >= DROP1 ? 14 : 6); sx += (Math.random() - 0.5) * k; sy += (Math.random() - 0.5) * k; }
        const pk = pulse(t) * 3; sx += (Math.random() - 0.5) * pk; sy += (Math.random() - 0.5) * pk;
      }
      const cx = W / 2, cy = H / 2;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.translate(sx, sy);
      drawStars(t, dt);
      text('IN A WORLD...', t, 0.6, 3.6, { size: 0.055, ls: 0.4, grow: true });
      text('WHERE 3RD PERIOD NEVER ENDS...', t, 3.9, 6.4, { size: 0.055, ls: 0.12, grow: true });
      text('ONE WEBSITE SAID:', t, 6.6, 7.95, { size: 0.045, ls: 0.3, grow: true, dim: true });
      shock(t, DROP1, false);
      text("LET'S GO.", t, DROP1, 9, { size: 0.13, ls: 0.04, pop: true, glitch: true });
      sceneGames(t); sceneMusic(t); sceneAI(t); sceneReviews(t);
      text('BUT THIS NOVEMBER...', t, BREAK + 0.2, DROP2 - 0.1, { size: 0.05, ls: 0.4, grow: true });
      shock(t, DROP2, true);
      sceneTitle(t, cx, cy);
      sceneMontage(t);
      text((movieCount ? movieCount + ' NEW MOVIES.' : 'NEW MOVIES.') + ' ONE PLACE.', t, MONT_B, DATE_A, { size: 0.07, ls: 0.08, pop: true, beat: true, f: 0.1 });
      text(dateLine(), t, DATE_A, END - 0.4, { size: 0.05, ls: 0.3, pop: true, beat: true, glitch: true });
      text('COUNTDOWNS  ·  TRAILERS  ·  RELEASE DATES', t, DATE_A + 0.4, END - 0.4, { size: 0.022, ls: 0.45, dy: 0.08, dim: true });
      sceneEnd(t, cx, cy);
      ctx.restore();
      // flashes on the big hits and a little one on every kick
      let fl = 0;
      for (const b of [DROP1, DROP2]) if (t > b && t < b + 1.2) fl = Math.max(fl, Math.exp(-(t - b) * 6) * 0.9);
      fl = Math.max(fl, pulse(t) * 0.06);
      if (t >= MONT_A && t < MONT_B) fl = Math.max(fl, Math.exp(-(((t - MONT_A) % (2 * BEAT))) * 22) * 0.35); // flash on each cut
      if (reduce) fl *= 0.3;
      if (fl > 0.005) { ctx.fillStyle = `rgba(255,255,255,${fl})`; ctx.fillRect(0, 0, W, H); }
      // film grain, vignette and movie bars
      ctx.save(); ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
      const ox = Math.random() * 160, oy = Math.random() * 160;
      ctx.translate(-ox, -oy); ctx.fillStyle = ctx.createPattern(grain, 'repeat'); ctx.fillRect(0, 0, W + 160, H + 160); ctx.restore();
      const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.3, cx, cy, Math.max(W, H) * 0.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.65)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      const bar = H * 0.08 * Math.min(1, t / 1.2); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
      el.querySelector('.tr-prog i').style.width = Math.min(100, (raw / (END + LEAD)) * 100) + '%';
      if (t >= END && !state.ended) finish();
      state.raf = requestAnimationFrame(draw);
    }
    function finish() {
      state.ended = true;
      el.querySelector('.tr-end').hidden = false;
      el.querySelector('.tr-days').textContent = daysLeft();
      el.querySelector('[data-tr-skip]').hidden = true;
      const b = el.querySelector('[data-tr-movies]'); if (b) b.focus();
    }
    state.skip = () => { if (state.ended) return; if (state.audio) try { state.audio.out.gain.value = 0; } catch (e) {} if (state.a1) state.a1.pause(); state.t0 = performance.now() - (END + LEAD) * 1000; };
    state.raf = requestAnimationFrame(draw);
    el.querySelector('[data-tr-close]').focus();
  }
  function stop() {
    if (!cur) return;
    cancelAnimationFrame(cur.raf); removeEventListener('resize', cur.onResize);
    if (cur.audio) try { cur.audio.ac.close(); } catch (e) {}
    [cur.a1, cur.a2].forEach((a) => { if (a) try { a.pause(); a.src = ''; } catch (e) {} });
    try { if (document.fullscreenElement === cur.el) document.exitFullscreen().catch(() => {}); } catch (e) {}
    cur.el.remove(); cur = null;
  }
  async function replay() { const m = cur && cur.muted; stop(); await start(); if (m) mute(); }
  function mute() {
    if (!cur) return;
    cur.muted = !cur.muted;
    if (cur.audio) cur.audio.out.gain.value = cur.muted ? 0 : (cur.songs ? 0.6 : 0.8);
    [cur.a1, cur.a2].forEach((a) => { if (a) a.muted = cur.muted; });
    const b = cur.el.querySelector('[data-tr-mute]'); if (b) b.textContent = cur.muted ? 'Sound: off' : 'Sound: on';
  }
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-trailer]')) { e.preventDefault(); const d = e.target.closest('.vx-dialog'); const x = d && d.querySelector('[data-x-close]'); if (x) x.click(); start(); return; }
    if (!cur) return;
    if (e.target.closest('[data-tr-close]')) stop();
    else if (e.target.closest('[data-tr-replay]')) replay();
    else if (e.target.closest('[data-tr-mute]')) mute();
    else if (e.target.closest('[data-tr-skip]')) cur.skip();
    else if (e.target.closest('[data-tr-next]')) cur.nextSong();
    else if (e.target.closest('[data-tr-movies]')) { stop(); if (window.VexoHub) location.hash = '#/movies'; else location.href = 'index.html#/movies'; }
    else if (e.target.closest('[data-tr-music]')) { setMode(getMode() === 'song' ? 'beat' : 'song'); replay(); }
  });
  document.addEventListener('keydown', (e) => {
    if (!cur) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); stop(); }
    else if (e.key === 'm' || e.key === 'M') mute();
  }, true);

  window.VexoTrailer = { play: start, stop, playing: () => !!cur };
})();

</script>

    const un = e.target.closest('[data-mp-unsave]'); if (un) { const id = un.closest('.mp-tile').dataset.id; saveLibrary(library().filter((x) => x.id !== id)); paintMain(); toast('Removed from Your Library'); return; }
    const rf = e.target.closest('[data-mp-rmfrom]'); if (rf) { const id = rf.closest('.mp-tile').dataset.id, l = playlists(), p = l.find((x) => x.id === rf.dataset.mpRmfrom); if (p) { p.items = p.items.filter((x) => x.id !== id); savePlaylists(l); paintMain(); } return; }
    if (e.target.closest('[data-mp-new]')) {
      const v = await window.Vexo.dialog({ title: 'New playlist', ok: 'Create', fields: [{ label: 'Name', attrs: 'maxlength="40" placeholder="My playlist"', check: (x) => (x.trim() ? '' : 'Give your playlist a name.') }] });
      if (!v) return;
      const l = playlists(), id = 'p' + Date.now().toString(36); l.push({ id, name: v[0].trim().slice(0, 40), items: [] }); savePlaylists(l); go('pl:' + id); toast('Playlist created'); return;
    }
    const rn = e.target.closest('[data-mp-rename]');
    if (rn) {
      const l = playlists(), p = l.find((x) => x.id === rn.dataset.mpRename); if (!p) return;
      const v = await window.Vexo.dialog({ title: 'Rename playlist', ok: 'Save', fields: [{ label: 'Name', attrs: `maxlength="40" value="${esc(p.name)}"`, check: (x) => (x.trim() ? '' : 'Give your playlist a name.') }] });
      if (!v) return; p.name = v[0].trim().slice(0, 40); savePlaylists(l); paintSide(); paintMain(); return;
    }
    const dp = e.target.closest('[data-mp-delpl]');
    if (dp) {
      const ok = await window.Vexo.ask('Delete this playlist?', 'The songs stay on Spotify. This only removes the playlist from Vexo.', 'Delete');
      if (!ok) return; savePlaylists(playlists().filter((x) => x.id !== dp.dataset.mpDelpl)); go('browse'); toast('Playlist deleted'); return;
    }
    if (e.target.closest('[data-mp-paste]')) {
      let text = ''; try { text = await navigator.clipboard.readText(); } catch (x) { text = ''; }
      if (text && parse(text)) { playLink(text); return; }
      const inp = document.getElementById('mpLink'); if (inp) inp.focus();
      toast(text ? "What you copied isn't a YouTube or Spotify link." : 'Paste the link in the box below.');
      return;
    }
    const my = e.target.closest('[data-my]');
    if (my) { const a = my.dataset.my; if (a === 'play') { if (songIdx < 0) playSong(0); else if (audio.paused) { if (nowPlaying) stop(); audio.play().catch(() => {}); } else audio.pause(); } if (a === 'next') playSong((songIdx + 1) % songs.length); if (a === 'prev') playSong((songIdx - 1 + songs.length) % songs.length); return; }
    const sg = e.target.closest('[data-song]'); if (sg) playSong(Number(sg.dataset.song));
  });
  document.addEventListener('submit', (e) => {
    const f = e.target;
    if (f.matches('[data-mp-find]')) {
      e.preventDefault(); const q = f.querySelector('#mpFind').value.trim(); if (!q) { f.querySelector('#mpFind').focus(); return; }
      runSearch(q);
    }
    if (f.matches('[data-mp-add]')) { e.preventDefault(); if (playLink(f.querySelector('#mpLink').value.trim())) f.querySelector('#mpLink').value = ''; }
    if (f.matches('[data-mp-addto]')) {
      e.preventDefault();
      const it = parse(f.querySelector('#mpAddTo').value.trim());
      if (!it) { toast("That isn't a YouTube or Spotify link. Tap Share, then Copy link."); return; }
      const l = playlists(), p = l.find((x) => x.id === f.dataset.mpAddto); if (!p) return;
      if (!p.items.some((x) => x.id === it.id)) p.items.push({ type: it.type, id: it.id, name: KIND[it.type] });
      savePlaylists(l); paintMain(); paintSide(); toast('Added to ' + p.name);
    }
  });
  document.addEventListener('paste', (e) => {
    if (e.target.id !== 'mpLink' && e.target.id !== 'mpFind') return;
    const text = (e.clipboardData || window.clipboardData).getData('text');
    if (parse(text)) { e.preventDefault(); playLink(text); }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id !== 'mpFiles') return;
    const files = [...e.target.files].filter((f) => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|ogg|oga|flac|opus|webm)$/i.test(f.name));
    e.target.value = '';
    if (!files.length) { toast('Pick a music file, like an MP3.'); return; }
    const first = songs.length;
    files.forEach((f) => songs.push({ title: f.name.replace(/\.[^.]+$/, '').slice(0, 80), url: URL.createObjectURL(f) }));
    toast(`Added ${files.length} song${files.length > 1 ? 's' : ''}`); playSong(first); paintMain();
  });

  document.addEventListener('vexo:ad', () => { try { audio.pause(); preview.pause(); } catch (e) {} }); // quiet while a full-screen ad plays
  window.VexoMusic = { page, itunes, show: () => { location.hash = '#/music'; }, play, stop, playing: () => !!nowPlaying || !audio.paused || !preview.paused, previewing: () => !preview.paused, nowPlaying: () => nowPlaying, songs: () => songs.length, featured: FEATURED.map((p) => p.name), youtube: YOUTUBE.map((p) => p.name) };
})();

<script>
/* Vexo - Vexo AI (#/ai): a chat page.
   Two brains to pick from at the top:
   - Vexo AI: Pollinations' free text AI (no key or sign-up needed).
   - Claude: Anthropic's Claude, using the visitor's own Claude API key. The key is saved only
     in that visitor's browser and sent only to api.anthropic.com.
   When an answer mentions one of Vexo's games, a Play button for it appears under the answer.
   The chat is saved in this browser. */
(function () {
  'use strict';
  const { esc, Store, toast } = window.Vexo;
  const KEY = 'vexo_ai_chat';
  const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(v) ? v.filter((m) => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string') : []; } catch (e) { return []; } };
  const save = (l) => { try { localStorage.setItem(KEY, JSON.stringify(l.slice(-40))); } catch (e) {} };
  let msgs = load(), busy = false, keyOpen = false;

  /* which AI answers: 'vexo' (free) or 'claude' (needs the visitor's own key) */
  const ENGINE_KEY = 'vexo_ai_engine', CKEY = 'vexo_ai_claude_key';
  const CLAUDE_MODEL = 'claude-opus-5-5';
  const get = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const put = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
  let engine = get(ENGINE_KEY) === 'claude' ? 'claude' : 'vexo';
  const claudeKey = () => get(CKEY);

  const BOT = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16.5h5"/><circle cx="12" cy="3.5" r="1"/></svg>';
  const CLAUDE = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l1.6 6.1 5.1-3.7-3.2 5.4 6 .9-6 1.6 4 4.7-5.5-2.7.2 6.2-2.2-5.9-2.2 5.9.2-6.2L4.5 17.5l4-4.7-6-1.6 6-.9L5.3 4.9l5.1 3.7z"/></svg>';
  const SEND = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  const SUGGEST = ['Recommend a fun 2 player game', 'What should I play if I like racing?', 'Help me study for a math test', 'Tell me a joke', 'Explain photosynthesis simply', 'Give me a fun fact'];

  function system() {
    const games = Store.games().map((g) => g.title).join(', ');
    return 'You are Vexo AI, the friendly helper on Vexo, a free games website. Many users are teens, so keep answers safe, kind and appropriate for school. ' +
      'Keep answers short and clear (a few sentences or a short list) unless asked for more. Help with homework by explaining, not just giving answers. ' +
      'When recommending games, prefer games on Vexo and write their exact names. Vexo has these games: ' + games + '. ' +
      'Do not help anyone get around school or work internet filters, and do not write out full song lyrics or long copied text from books or articles.';
  }

  /* ---------- talking to the AI ---------- */
  function withTimeout(ms) { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }
  async function ask(history) {
    const messages = [{ role: 'system', content: system() }].concat(history.slice(-12).map((m) => ({ role: m.role, content: m.content.slice(0, 4000) })));
    try {
      const r = await fetch('https://text.pollinations.ai/openai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'openai', messages, private: true }), signal: withTimeout(45000) });
      if (r.ok) {
        const j = await r.json();
        const t = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if (t && String(t).trim()) return String(t).trim();
      }
    } catch (e) { /* try the simple way below */ }
    const last = history[history.length - 1].content.slice(0, 1500);
    const r2 = await fetch('https://text.pollinations.ai/' + encodeURIComponent(last) + '?model=openai&private=true&system=' + encodeURIComponent(system().slice(0, 1800)), { signal: withTimeout(45000) });
    if (!r2.ok) throw new Error('http ' + r2.status);
    const t2 = (await r2.text()).trim();
    if (!t2) throw new Error('empty');
    return t2;
  }

  /* ---------- talking to Claude ---------- */
  function claudeHistory(history) {
    // Claude wants turns that go user, assistant, user... and start with the user.
    const out = [];
    for (const m of history.slice(-16)) {
      if (m.err) continue;
      const content = m.content.slice(0, 4000);
      const last = out[out.length - 1];
      if (last && last.role === m.role) last.content += '\n\n' + content;
      else out.push({ role: m.role, content });
    }
    while (out.length && out[0].role !== 'user') out.shift();
    return out;
  }
  async function askClaude(history) {
    const key = claudeKey();
    if (!key) { const e = new Error('nokey'); e.kind = 'nokey'; throw e; }
    let r;
    try {
      r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2026-10-21',
          'anthropic-beta': 'server-side-fallback-2026-07-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: CLAUDE_MODEL,
          max_tokens: 16000,
          system: system(),
          messages: claudeHistory(history),
          output_config: { effort: 'low' },
          fallbacks: 'default'
        }),
        signal: withTimeout(90000)
      });
    } catch (x) { const e = new Error('net'); e.kind = 'net'; throw e; }
    let j = null; try { j = await r.json(); } catch (x) {}
    if (!r.ok) {
      const e = new Error('http ' + r.status);
      e.kind = r.status === 401 || r.status === 403 ? 'badkey' : r.status === 429 ? 'busy' : (r.status === 400 && j && j.error && /credit|billing/i.test(j.error.message || '')) ? 'credit' : r.status >= 500 ? 'down' : 'other';
      throw e;
    }
    if (!j) throw new Error('empty');
    if (j.stop_reason === 'refusal') return "I can't help with that one. Try asking something else!";
    const t = (j.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('').trim();
    if (!t) throw new Error('empty');
    return t;
  }
  const CLAUDE_ERR = {
    nokey: 'To use Claude, add your Claude API key first. Tap "Claude key" at the top.',
    badkey: "That Claude key didn't work. Check it and paste it again with the \"Claude key\" button at the top.",
    credit: 'Your Claude account is out of credit. Add credit at console.anthropic.com, or switch to Vexo AI (free) at the top.',
    busy: 'Claude is getting too many messages right now. Wait a minute and try again.',
    down: 'Claude is having trouble right now. Try again in a minute, or switch to Vexo AI at the top.',
    net: "I can't reach Claude right now. The network might be blocking it. Try again later, or switch to Vexo AI at the top."
  };

  /* ---------- showing messages ---------- */
  function md(text) {
    const lines = esc(text).replace(/\r/g, '').split('\n');
    let out = '', list = '';
    const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,!?]|$)/g, '$1<i>$2</i>');
    const close = () => { if (list) { out += `</${list}>`; list = ''; } };
    for (const raw of lines) {
      const l = raw.trim();
      let m;
      if ((m = l.match(/^[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
      else if ((m = l.match(/^\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
      else if ((m = l.match(/^#{1,4}\s+(.*)/))) { close(); out += `<p><b>${inline(m[1])}</b></p>`; }
      else if (!l) close();
      else { close(); out += `<p>${inline(l)}</p>`; }
    }
    close();
    return out;
  }
  function gamesIn(text) {
    const t = text.toLowerCase(), seen = new Set();
    return Store.games().filter((g) => g.title.length >= 4 && t.includes(g.title.toLowerCase()) && !seen.has(g.id) && seen.add(g.id)).slice(0, 4);
  }
  function bubble(m, i) {
    if (m.role === 'user') return `<div class="ai-msg ai-user"><div class="ai-b">${esc(m.content).replace(/\n/g, '<br>')}</div></div>`;
    const gs = gamesIn(m.content);
    return `<div class="ai-msg ai-bot"><span class="ai-av${m.by === 'claude' ? ' is-claude' : ''}">${m.by === 'claude' ? CLAUDE : BOT}</span><div class="ai-b">${m.by === 'claude' ? '<span class="ai-by">Claude</span>' : ''}${md(m.content)}
      ${gs.length ? `<div class="ai-games">${gs.map((g) => `<a class="ai-play" href="#/play/${encodeURIComponent(g.id)}" data-open="${esc(g.id)}"><svg class="ic" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>Play ${esc(g.title)}</a>`).join('')}</div>` : ''}
      <button type="button" class="ai-copy" data-ai-copy="${i}">Copy</button></div></div>`;
  }
  function thread() {
    if (!msgs.length) return `<div class="ai-hello"><span class="ai-big">${BOT}</span><h2>Hi, I'm Vexo AI</h2><p>Ask me anything: game picks, homework help, fun facts or jokes.</p>
      <div class="ai-sugs">${SUGGEST.map((s) => `<button type="button" class="ai-sug" data-ai-sug="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;
    return msgs.map(bubble).join('') + (busy ? `<div class="ai-msg ai-bot"><span class="ai-av">${BOT}</span><div class="ai-b ai-typing" aria-label="Vexo AI is typing"><i></i><i></i><i></i></div></div>` : '');
  }
  function page() {
    return `<div class="ai">
      <header class="ai-top"><span class="ai-title">${BOT}<b>Vexo AI</b></span>
        <div class="ai-tools">
          <div class="ai-pick" role="group" aria-label="Choose which AI answers">
            <button type="button" data-ai-engine="vexo" aria-pressed="${engine === 'vexo'}">Vexo AI <small>free</small></button>
            <button type="button" data-ai-engine="claude" aria-pressed="${engine === 'claude'}">${CLAUDE}Claude</button>
          </div>
          <button type="button" class="mp-btn" data-ai-key ${engine === 'claude' ? '' : 'hidden'}>Claude key</button>
          <button type="button" class="mp-btn" data-ai-new>New chat</button>
        </div></header>
      <div id="aiKeyBox">${keyBox()}</div>
      <div class="ai-thread" id="aiThread" aria-live="polite">${thread()}</div>
      <form class="ai-form" data-ai-form novalidate>
        <textarea id="aiInput" rows="1" placeholder="${engine === 'claude' ? 'Message Claude' : 'Message Vexo AI'}" aria-label="Message the AI" maxlength="2000"></textarea>
        <button type="submit" class="ai-send" aria-label="Send">${SEND}</button>
      </form>
      <p class="ai-foot">Vexo AI can make mistakes, so double-check important stuff. Don't share private info like passwords or your address.</p>
    </div>`;
  }
  function keyBox() {
    if (!(engine === 'claude' && (keyOpen || !claudeKey()))) return '';
    const has = !!claudeKey();
    return `<form class="ai-key" data-ai-keyform novalidate>
      <b>${has ? 'Your Claude key' : 'Add your Claude API key to use Claude'}</b>
      <p>Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. Claude costs a little money per message, and it's billed to that key's account. Your key is saved only on this device and only sent to Anthropic. Never share it with anyone.</p>
      <div class="ai-key-row"><input id="aiKeyIn" type="password" autocomplete="off" spellcheck="false" placeholder="${has ? 'Key saved. Paste a new one to change it' : 'sk-ant-...'}" aria-label="Claude API key">
        <button type="submit" class="mp-btn is-on">Save</button>
        ${has ? '<button type="button" class="mp-btn" data-ai-keydel>Remove key</button>' : ''}</div>
    </form>`;
  }
  function paintTop() {
    document.querySelectorAll('[data-ai-engine]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.aiEngine === engine)));
    const k = document.querySelector('[data-ai-key]'); if (k) k.hidden = engine !== 'claude';
    const box = document.getElementById('aiKeyBox'); if (box) box.innerHTML = keyBox();
    const i = document.getElementById('aiInput'); if (i) i.placeholder = engine === 'claude' ? 'Message Claude' : 'Message Vexo AI';
  }
  function paint() {
    const t = document.getElementById('aiThread'); if (!t) return;
    t.innerHTML = thread(); t.scrollTop = t.scrollHeight;
    const b = document.querySelector('.ai-send'); if (b) b.disabled = busy;
  }
  function mounted() { paint(); const i = document.getElementById('aiInput'); if (i && matchMedia('(pointer: fine)').matches) i.focus(); }

  async function send(text) {
    text = String(text || '').trim(); if (!text || busy) return;
    msgs.push({ role: 'user', content: text.slice(0, 2000) }); save(msgs);
    document.dispatchEvent(new CustomEvent('vexo:ai'));
    busy = true; paint();
    const by = engine;
    try {
      const reply = by === 'claude' ? await askClaude(msgs) : await ask(msgs);
      msgs.push({ role: 'assistant', content: reply.slice(0, 8000), by }); save(msgs);
    } catch (e) {
      const t = by === 'claude' ? (CLAUDE_ERR[e.kind] || "Sorry, Claude couldn't answer that. Try again in a minute.") : "Sorry, I can't connect right now. The network might be blocking me, or the AI is busy. Try again in a minute.";
      msgs.push({ role: 'assistant', content: t, by, err: true });
      if (e.kind === 'nokey' || e.kind === 'badkey') { keyOpen = true; paintTop(); }
    }
    busy = false; paint();
  }

  /* ---------- clicks and typing ---------- */
  document.addEventListener('submit', (e) => {
    if (e.target.matches('[data-ai-keyform]')) {
      e.preventDefault();
      const v = (document.getElementById('aiKeyIn').value || '').trim();
      if (!v) { toast('Paste your Claude key first'); return; }
      if (!/^sk-ant-/.test(v)) { toast('That doesn\'t look like a Claude key. It starts with sk-ant-'); return; }
      put(CKEY, v); keyOpen = false; paintTop(); toast('Claude key saved on this device');
      const i = document.getElementById('aiInput'); if (i) i.focus();
      return;
    }
    if (!e.target.matches('[data-ai-form]')) return;
    e.preventDefault(); const i = document.getElementById('aiInput'); const v = i.value; i.value = ''; i.style.height = ''; send(v);
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'aiInput' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit ? e.target.form.requestSubmit() : e.target.form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true })); }
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'aiInput') { e.target.style.height = ''; e.target.style.height = Math.min(160, e.target.scrollHeight) + 'px'; } });
  document.addEventListener('click', async (e) => {
    const s = e.target.closest('[data-ai-sug]'); if (s) { send(s.dataset.aiSug); return; }
    const en = e.target.closest('[data-ai-engine]');
    if (en) { engine = en.dataset.aiEngine === 'claude' ? 'claude' : 'vexo'; put(ENGINE_KEY, engine); keyOpen = false; paintTop(); return; }
    if (e.target.closest('[data-ai-key]')) { keyOpen = !keyOpen; paintTop(); const k = document.getElementById('aiKeyIn'); if (k) k.focus(); return; }
    if (e.target.closest('[data-ai-keydel]')) { put(CKEY, ''); keyOpen = false; paintTop(); toast('Claude key removed'); return; }
    if (e.target.closest('[data-ai-new]')) { if (busy) return; msgs = []; save(msgs); paint(); const i = document.getElementById('aiInput'); if (i) i.focus(); return; }
    const c = e.target.closest('[data-ai-copy]');
    if (c) { const m = msgs[Number(c.dataset.aiCopy)]; if (!m) return; try { await navigator.clipboard.writeText(m.content); toast('Copied'); } catch (x) { toast("Couldn't copy. Select the text instead."); } }
  });

  // short answer for the Vexo Search page (always the free Vexo AI, so searching never costs money)
  const answer = (q) => ask([{ role: 'user', content: String(q).slice(0, 500) + '\n\nAnswer this search in 2 to 4 short sentences.' }]);
  window.VexoAI = { page, mounted, send, answer, md, messages: () => msgs.slice(), busy: () => busy, engine: () => engine };
})();

</script>
<script>
/* Vexo - Vexo Search (#/web?q=...): search results shown right inside Vexo.
   - Quick answers: calculator, flip a coin, roll a die, random number, word meanings.
   - "Vexo AI says": a short answer from the free Vexo AI.
   - Games on Vexo that match.
   - Web results and a fact box from Wikipedia (free, no key needed).
   - Buttons to open the same search on Google, Bing or DuckDuckGo in a new tab.
   Also: the clock and weather line on the home screen (weather from Open-Meteo, free, no key). */
(function () {
  'use strict';
  const { esc, Store, toast, search, thumbOf } = window.Vexo;
  let token = 0;

  /* ---------- small helpers ---------- */
  const text = (html) => { try { return new DOMParser().parseFromString(String(html || ''), 'text/html').body.textContent || ''; } catch (e) { return ''; } };
  function timeout(ms) { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }
  async function getJSON(url, ms = 12000) { const r = await fetch(url, { signal: timeout(ms) }); if (!r.ok) throw new Error('http ' + r.status); return r.json(); }
  const mark = (s, q) => {
    let out = esc(s);
    q.split(/\s+/).filter((w) => w.length > 2).slice(0, 5).map((w) => w.length > 4 ? w.replace(/s$/i, '') : w).forEach((w) => { out = out.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<b>$1</b>'); });
    return out;
  };
  const SEARCH_IC = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
  const BOT = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16.5h5"/><circle cx="12" cy="3.5" r="1"/></svg>';
  const ENGINES = [
    { name: 'Google', url: 'https://www.google.com/search?q=' },
    { name: 'Bing', url: 'https://www.bing.com/search?q=' },
    { name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' },
    { name: 'YouTube', url: 'https://www.youtube.com/results?search_query=' }
  ];

  /* ---------- calculator (safe: reads the math itself, never runs code) ---------- */
  function calc(src) {
    let s = src.toLowerCase().replace(/^(what is|what's|whats|calculate|solve)\s+/, '').replace(/[=?]+\s*$/, '').replace(/×|x(?=\s*[\d(])/g, '*').replace(/÷/g, '/').replace(/,/g, '').trim();
    if (!/^[\d\s+\-*/().^%]+$/.test(s) || !/\d/.test(s) || !/[+\-*/^%]/.test(s.replace(/^-/, ''))) return null;
    let i = 0;
    const peek = () => { while (s[i] === ' ') i++; return s[i]; };
    function num() {
      const c = peek();
      if (c === '(') { i++; const v = add(); if (peek() !== ')') throw 0; i++; return v; }
      if (c === '-') { i++; return -pow(); }
      if (c === '+') { i++; return pow(); }
      const m = s.slice(i).match(/^\d*\.?\d+/); if (!m) throw 0; i += m[0].length;
      let v = parseFloat(m[0]);
      if (peek() === '%') { i++; v /= 100; }
      return v;
    }
    function pow() { const b = num(); if (peek() === '^') { i++; return Math.pow(b, pow()); } return b; }
    function mul() { let v = pow(); for (;;) { const c = peek(); if (c === '*') { i++; v *= pow(); } else if (c === '/') { i++; v /= pow(); } else return v; } }
    function add() { let v = mul(); for (;;) { const c = peek(); if (c === '+') { i++; v += mul(); } else if (c === '-') { i++; v -= mul(); } else return v; } }
    try { const v = add(); if (peek() !== undefined || !isFinite(v)) return null; return { expr: s, value: Math.round(v * 1e10) / 1e10 }; } catch (e) { return null; }
  }

  /* ---------- quick answers that need no internet ---------- */
  function instant(q) {
    const l = q.toLowerCase().trim();
    const c = calc(q);
    if (c) return `<div class="ws-card ws-calc"><small>${esc(c.expr)} =</small><b>${esc(c.value.toLocaleString(undefined, { maximumFractionDigits: 10 }))}</b></div>`;
    if (/^(flip a coin|coin flip|heads or tails)$/.test(l)) return `<div class="ws-card ws-calc"><small>Coin flip</small><b>${Math.random() < 0.5 ? 'Heads' : 'Tails'}</b><button type="button" class="mp-btn" data-ws-again>Flip again</button></div>`;
    if (/^(roll a (die|dice)|roll dice|dice roll)$/.test(l)) return `<div class="ws-card ws-calc"><small>You rolled</small><b>${1 + Math.floor(Math.random() * 6)}</b><button type="button" class="mp-btn" data-ws-again>Roll again</button></div>`;
    const rn = l.match(/^random number(?: (?:between|from) (-?\d+) (?:and|to) (-?\d+))?$/);
    if (rn) { const a = rn[1] ? +rn[1] : 1, b = rn[2] ? +rn[2] : 100, lo = Math.min(a, b), hi = Math.max(a, b); return `<div class="ws-card ws-calc"><small>Random number from ${lo} to ${hi}</small><b>${lo + Math.floor(Math.random() * (hi - lo + 1))}</b><button type="button" class="mp-btn" data-ws-again>Again</button></div>`; }
    if (/^(what time is it|time|current time|what's the time)$/.test(l)) return `<div class="ws-card ws-calc"><small>${esc(new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }))}</small><b>${esc(new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }))}</b></div>`;
    return '';
  }

  /* ---------- the page ---------- */
  function bar(q, big) {
    return `<form class="ws-bar${big ? ' is-big' : ''}" data-ws-form role="search">
      ${big ? '' : '<a class="ws-logo vx-logo" href="#/" aria-label="Vexo home">vexo</a>'}
      <label class="ws-input">${SEARCH_IC}<input id="wsInput" type="search" value="${esc(q)}" placeholder="Search the web" autocomplete="off" spellcheck="false" aria-label="Search the web"></label>
      <button type="submit" class="ws-go">Search</button>
    </form>`;
  }
  function page(q) {
    q = String(q || '').trim();
    if (!q) return `<div class="ws ws-empty"><h1 class="vx-logo ws-hero">vexo</h1><p class="ws-sub">Search the web</p>${bar('', true)}
      <div class="ws-tips">Try: <button type="button" data-ws-q="black holes">black holes</button><button type="button" data-ws-q="define curious">define curious</button><button type="button" data-ws-q="25*16+7">25*16+7</button><button type="button" data-ws-q="flip a coin">flip a coin</button><button type="button" data-ws-q="racing games">racing games</button></div></div>`;
    return `<div class="ws">${bar(q)}
      <div class="ws-body">
        <div class="ws-main">
          <div id="wsInstant">${instant(q)}</div>
          <div id="wsAi"></div>
          <div id="wsGames"></div>
          <div id="wsResults"><div class="ws-load"><i></i><i></i><i></i></div></div>
          <div class="ws-more"><span>More results for "${esc(q)}" on</span>${ENGINES.map((e) => `<a href="${esc(e.url + encodeURIComponent(q))}" target="_blank" rel="noopener">${esc(e.name)}</a>`).join('')}<small>These open in a new tab.</small></div>
        </div>
        <aside class="ws-side" id="wsSide"></aside>
      </div></div>`;
  }

  /* ---------- filling in the results ---------- */
  function gamesBox(q) {
    const res = search(q, Store.games()).slice(0, 6);
    if (!res.length) return '';
    return `<section class="ws-sec"><h2>Games on Vexo</h2><div class="ws-games">${res.map((g) => `<a class="ws-game" href="#/play/${encodeURIComponent(g.id)}" data-open="${esc(g.id)}"><img src="${esc(thumbOf(g))}" alt="" loading="lazy" data-hide-err><span>${esc(g.title)}</span></a>`).join('')}</div></section>`;
  }
  async function wiki(q, my) {
    const box = document.getElementById('wsResults'); if (!box) return;
    try {
      const j = await getJSON('https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=10&srprop=snippet&srsearch=' + encodeURIComponent(q));
      if (my !== token) return;
      const list = (j.query && j.query.search) || [];
      if (!list.length) { box.innerHTML = `<p class="ws-none">No web results found for "<b>${esc(q)}</b>". Try other words, or use the buttons below.</p>`; return; }
      box.innerHTML = `<section class="ws-sec"><h2>Web results</h2>${list.map((r) => {
        const url = 'https://en.wikipedia.org/wiki/' + encodeURIComponent(r.title.replace(/ /g, '_'));
        return `<article class="ws-r"><a href="${esc(url)}" target="_blank" rel="noopener"><span class="ws-site"><img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=32" alt="" data-hide-err>Wikipedia <small>en.wikipedia.org › wiki › ${esc(r.title)}</small></span><h3>${esc(r.title)}</h3></a><p>${mark(text(r.snippet), q)}...</p></article>`;
      }).join('')}</section>`;
      side(list[0].title, q, my);
    } catch (e) {
      if (my !== token) return;
      box.innerHTML = `<p class="ws-none">Couldn't load web results right now. The network might be blocking them. You can still use the buttons below.</p>`;
    }
  }
  async function side(title, q, my) {
    const el = document.getElementById('wsSide'); if (!el) return;
    try {
      const s = await getJSON('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')));
      if (my !== token || !s || !s.extract || s.type === 'disambiguation') return;
      const url = (s.content_urls && s.content_urls.desktop && s.content_urls.desktop.page) || ('https://en.wikipedia.org/wiki/' + encodeURIComponent(title));
      el.insertAdjacentHTML('afterbegin', `<section class="ws-card ws-fact">${s.thumbnail ? `<img src="${esc(s.thumbnail.source)}" alt="" data-hide-err>` : ''}
        <h2>${esc(s.title)}</h2>${s.description ? `<small>${esc(s.description)}</small>` : ''}<p>${esc(s.extract)}</p>
        <a href="${esc(url)}" target="_blank" rel="noopener">Read more on Wikipedia</a></section>`);

  async function define(q, my) {
    const m = q.trim().match(/^(?:define|meaning of|definition of|what does)\s+([a-z'-]+)(?:\s+mean)?\??$/i) || q.trim().match(/^([a-z'-]{3,})$/i);
    if (!m) return;
    try {
      const j = await getJSON('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(m[1].toLowerCase()));
      if (my !== token || !Array.isArray(j) || !j[0]) return;
      const w = j[0], ph = w.phonetic || ((w.phonetics || []).find((p) => p.text) || {}).text || '';
      const audio = ((w.phonetics || []).find((p) => p.audio) || {}).audio || '';
      const means = (w.meanings || []).slice(0, 3).map((mm) => `<div class="ws-mean"><i>${esc(mm.partOfSpeech || '')}</i><ol>${(mm.definitions || []).slice(0, 2).map((d) => `<li>${esc(d.definition)}${d.example ? `<em>"${esc(d.example)}"</em>` : ''}</li>`).join('')}</ol></div>`).join('');
      const el = document.getElementById('wsSide'); if (!el || !means) return;
      el.insertAdjacentHTML('afterbegin', `<section class="ws-card ws-dict"><h2>${esc(w.word)}${audio ? ` <button type="button" class="ws-say" data-ws-say="${esc(audio)}" aria-label="Hear it">&#128264;</button>` : ''}</h2>${ph ? `<small>${esc(ph)}</small>` : ''}${means}</section>`);
    } catch (e) { /* not a dictionary word */ }
  }
  async function ai(q, my) {
    const el = document.getElementById('wsAi');
    if (!el || !window.VexoAI || !window.VexoAI.answer || q.length < 3 || calc(q) || instant(q)) return;
    el.innerHTML = `<section class="ws-card ws-ai"><h2>${BOT}Vexo AI says</h2><div class="ai-typing"><i></i><i></i><i></i></div></section>`;
    try {
      const t = await window.VexoAI.answer(q);
      if (my !== token) return;
      el.innerHTML = `<section class="ws-card ws-ai"><h2>${BOT}Vexo AI says</h2><div class="ws-ai-t">${window.VexoAI.md(t)}</div>
        <button type="button" class="mp-btn" data-ws-chat="${esc(q)}">Keep chatting about this</button><small>AI can be wrong, so check important stuff.</small></section>`;
    } catch (e) { if (my === token) el.innerHTML = ''; }
  }
  function mounted(q) {
    q = String(q || '').trim();
    const my = ++token;
    const i = document.getElementById('wsInput');
    if (!q) { if (i && matchMedia('(pointer: fine)').matches) i.focus(); return; }
    saveRecent(q);
    document.dispatchEvent(new CustomEvent('vexo:search'));
    const g = document.getElementById('wsGames'); if (g) g.innerHTML = gamesBox(q);
    ai(q, my); wiki(q, my); define(q, my);
  }
  const saveRecent = (q) => { try { const k = 'vexo_searches', l = JSON.parse(localStorage.getItem(k) || '[]'); localStorage.setItem(k, JSON.stringify([q].concat((Array.isArray(l) ? l : []).filter((x) => typeof x === 'string' && x.toLowerCase() !== q.toLowerCase())).slice(0, 6))); } catch (e) {} };

  function go(q) {
    q = String(q || '').trim(); if (!q) return;
    const h = '#/web?q=' + encodeURIComponent(q);

    else location.hash = h;
  }
  document.addEventListener('submit', (e) => {
    if (!e.target.matches('[data-ws-form]')) return;
    e.preventDefault(); go(document.getElementById('wsInput').value);
  });
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-ws-q]'); if (t) { go(t.dataset.wsQ); return; }
    if (e.target.closest('[data-ws-again]')) { const el = document.getElementById('wsInput'); const box = document.getElementById('wsInstant'); if (el && box) box.innerHTML = instant(el.value); return; }
    const say = e.target.closest('[data-ws-say]'); if (say) { try { new Audio(say.dataset.wsSay).play(); } catch (x) {} return; }
    const ch = e.target.closest('[data-ws-chat]');
    if (ch && window.VexoAI) { const q = ch.dataset.wsChat; location.hash = '#/ai'; setTimeout(() => window.VexoAI.send(q), 60); }
  });

  /* ---------- clock and weather on the home screen ---------- */
  const W_KEY = 'vexo_weather';
  const wGet = () => { try { return JSON.parse(localStorage.getItem(W_KEY) || 'null'); } catch (e) { return null; } };
  const wPut = (v) => { try { v ? localStorage.setItem(W_KEY, JSON.stringify(v)) : localStorage.removeItem(W_KEY); } catch (e) {} };
  const useF = () => /^en-(US|LR)|^my/.test(navigator.language || 'en-US');
  const WCODE = (c) => c === 0 ? 'Clear' : c <= 2 ? 'Partly cloudy' : c === 3 ? 'Cloudy' : c <= 48 ? 'Foggy' : c <= 57 ? 'Drizzle' : c <= 67 ? 'Rain' : c <= 77 ? 'Snow' : c <= 82 ? 'Showers' : c <= 86 ? 'Snow showers' : 'Storms';
  function clock() {
    return `<div class="px-clock" id="pxClock"><span data-clock-t></span><span class="px-dot" aria-hidden="true">·</span><span data-clock-d></span><span class="px-dot" aria-hidden="true">·</span><button type="button" class="px-weather" data-weather>${weatherText()}</button></div>`;
  }
  function weatherText() {
    const w = wGet();
    if (!w || !w.name) return 'Add weather';
    if (w.temp == null) return esc(w.name);
    return `${Math.round(w.temp)}°${w.f ? 'F' : 'C'} ${esc(WCODE(w.code))}, ${esc(w.name)}`;
  }
  let clockTimer = 0;
  function tick() {
    const el = document.getElementById('pxClock'); if (!el) { clearInterval(clockTimer); clockTimer = 0; return; }
    const d = new Date();
    el.querySelector('[data-clock-t]').textContent = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    el.querySelector('[data-clock-d]').textContent = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  async function refreshWeather(force) {
    const w = wGet(); if (!w || w.lat == null) return;
    const f = useF();
    if (!force && w.at && Date.now() - w.at < 30 * 60 * 1000 && w.f === f) return;
    try {
      const j = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&current=temperature_2m,weather_code${f ? '&temperature_unit=fahrenheit' : ''}`);
      if (!j.current) return;
      wPut(Object.assign(w, { temp: j.current.temperature_2m, code: j.current.weather_code, at: Date.now(), f }));
      const b = document.querySelector('[data-weather]'); if (b) b.innerHTML = weatherText();
    } catch (e) { /* keep the last weather */ }
  }
  function startClock() { tick(); if (!clockTimer) clockTimer = setInterval(tick, 10000); refreshWeather(false); }
  async function setCity() {
    const cur = wGet();
    const v = await window.Vexo.dialog({ title: 'Weather', ok: 'Save', text: 'Type your city to show its weather on the home screen. It\'s saved only on this device.', fields: [{ label: 'City', attrs: `placeholder="Chicago" value="${esc((cur && cur.name) || '')}" autocomplete="off"`, check: (x) => x.trim() ? '' : 'Type a city name' }] });
    if (!v) return;
    const name = v[0].trim();
    try {
      const j = await getJSON('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=' + encodeURIComponent(name));
      const r = j.results && j.results[0];
      if (!r) { toast(`Couldn't find "${name}". Try a bigger city nearby.`); return; }
      wPut({ name: r.name, lat: r.latitude, lon: r.longitude });
      const b = document.querySelector('[data-weather]'); if (b) b.innerHTML = weatherText();
      refreshWeather(true);
    } catch (e) { toast("Couldn't load the weather right now. Try again later."); }
  }
  document.addEventListener('click', (e) => { if (e.target.closest('[data-weather]')) { e.preventDefault(); setCity(); } });

  window.VexoSearch = { page, mounted, go, clock, startClock, calc, instant };
})();
