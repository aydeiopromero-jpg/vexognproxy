<style>
/* ===========================================================
   Vexo - portal styles
   Dark neon theme · purple + blue accents · no external assets
   =========================================================== */
:root {
  --bg: #121218;
  --bg2: #18181f;
  --panel: #1e1e27;
  --panel2: #26263a;
  --panel3: #2e2e48;
  --line: rgba(255, 255, 255, .08);
  --line2: rgba(168, 85, 247, .35);
  --text: #ececff;
  --muted: #9b9dc9;
  --dim: #6c6e9c;
  --purple: #a855f7;
  --violet: #7c3aed;
  --blue: #3b82f6;
  --cyan: #22d3ee;
  --pink: #f472b6;
  --red: #f43f5e;
  --green: #22c55e;
  --grad: linear-gradient(135deg, #7c3aed, #2563eb);
  --grad-text: linear-gradient(90deg, #e9d5ff, #a855f7 45%, #60a5fa);
  --glow: 0 0 22px rgba(124, 58, 237, .45);
  --radius: 14px;
  --top: 64px;
  --side: 0px;
  color-scheme: dark;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(59, 130, 246, .13), transparent 60%),
    radial-gradient(800px 500px at 10% 0%, rgba(168, 85, 247, .16), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
kbd { font-family: inherit; font-size: .78em; padding: 1px 6px; border-radius: 5px; background: var(--panel3); border: 1px solid var(--line2); border-bottom-width: 2px; color: #e9d5ff; }
.ic { width: 20px; height: 20px; flex: none; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #2a2a5a; border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #3c3c7a; }

/* ---------------- top bar ---------------- */
.topbar {
  position: fixed; inset: 0 0 auto 0; height: var(--top); z-index: 50; display: flex; align-items: center; gap: 16px; padding: 0 18px;
  background: rgba(8, 8, 26, .86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--purple), var(--blue), transparent); opacity: .6; }
.logo { display: flex; align-items: center; gap: 10px; flex: none; }
.logo-mark { width: 38px; height: 38px; filter: drop-shadow(0 0 8px rgba(168, 85, 247, .6)); }
.logo-text { font-weight: 900; font-style: italic; font-size: 21px; letter-spacing: .5px; white-space: nowrap; background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo-text .dash { color: var(--cyan); -webkit-text-fill-color: var(--cyan); }
.logo-text em { font-style: italic; -webkit-text-fill-color: #fff; color: #fff; text-shadow: 0 0 14px rgba(96, 165, 250, .7); }
.logo.small .logo-mark { width: 30px; height: 30px; }
.logo.small .logo-text { font-size: 17px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.icon-btn:hover { background: var(--panel2); border-color: var(--line2); }
.menu-btn { display: none; }

.search { position: relative; flex: 1; max-width: 560px; margin: 0 auto; display: flex; align-items: center; }
.search > .ic { position: absolute; left: 14px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; height: 42px; padding: 0 42px 0 44px; border-radius: 999px; border: 1px solid var(--line2);
  background: rgba(17, 17, 44, .9); outline: none; transition: border-color .15s, box-shadow .15s;
}
.search input::placeholder { color: var(--dim); }
.search input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(168, 85, 247, .2), var(--glow); }
.search input::-webkit-search-cancel-button { filter: invert(1) opacity(.5); }
.kbd-hint { position: absolute; right: 14px; pointer-events: none; }
.search input:focus ~ .kbd-hint { display: none; }
.suggest { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; box-shadow: 0 20px 50px rgba(0, 0, 0, .6), var(--glow); padding: 6px; display: none; z-index: 60; }
.suggest.open { display: block; }
.sug { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 10px; }
.sug img { width: 64px; height: 48px; object-fit: cover; border-radius: 7px; flex: none; }
.sug b { display: block; font-size: 14.5px; }
.sug small { color: var(--muted); font-size: 12px; }
.sug:hover, .sug.sel { background: var(--panel3); }
.sug.all { color: var(--cyan); font-size: 13.5px; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; margin-top: 4px; padding: 10px; }
.sug.empty { color: var(--muted); padding: 14px; font-size: 14px; }

.top-actions { display: flex; gap: 6px; flex: none; }
.top-btn { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 13px; border-radius: 10px; color: var(--muted); font-weight: 700; font-size: 14px; border: 1px solid transparent; }
.top-btn:hover { color: #fff; background: var(--panel); border-color: var(--line); }
.top-btn.active { color: #fff; background: var(--panel2); border-color: var(--line2); }
.top-btn .count { position: absolute; top: 3px; left: 24px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--pink); color: #fff; font-size: 10.5px; line-height: 17px; text-align: center; }

/* ---------------- sidebar ---------------- */
.sidebar {
  position: fixed; top: var(--top); bottom: 0; left: 0; width: var(--side); z-index: 40; overflow-y: auto; padding: 14px 10px 18px;
  background: rgba(9, 9, 28, .92); border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
}
.side-link { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--muted); font-weight: 650; font-size: 14.5px; transition: background .12s, color .12s; }
.side-link .ic { color: var(--c, var(--muted)); }
.side-link:hover { background: var(--panel); color: #fff; }
.side-link.active { background: linear-gradient(90deg, rgba(124, 58, 237, .35), rgba(37, 99, 235, .12)); color: #fff; box-shadow: inset 3px 0 0 var(--purple); }
.side-link.active .ic { color: #fff; }
.side-link[data-count]::after { content: attr(data-count); margin-left: auto; font-size: 12px; color: var(--dim); }
.side-count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--dim); }
.side-title { margin: 16px 12px 6px; font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim); }
.side-note { margin: 0 6px; padding: 12px; border-radius: 12px; background: var(--panel); border: 1px dashed var(--line2); color: var(--muted); font-size: 12.5px; }
.scrim { display: none; }

/* ---------------- layout ---------------- */
main, .site-footer { margin-left: var(--side); }
main { padding: calc(var(--top) + 22px) 26px 30px; min-height: 80vh; max-width: 1640px; }
.section { margin: 0 0 34px; }
.sec-head { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
.sec-head h2 { margin: 0; font-size: 21px; font-weight: 850; letter-spacing: .3px; display: flex; align-items: center; gap: 10px; }
.sec-head h2 .ic { width: 22px; height: 22px; color: var(--purple); }
.sec-head .more { margin-left: auto; color: var(--cyan); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 2px; }
.sec-head .more:hover { text-decoration: underline; }
.sec-head .more .ic { width: 16px; height: 16px; }
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 20px; }
.page-head h1 { margin: 0; font-size: 28px; font-weight: 900; display: flex; align-items: center; gap: 12px; }
.page-head h1 .ic { width: 30px; height: 30px; }
.page-head p { margin: 0; color: var(--muted); width: 100%; }
.page-head .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.select, .btn {
  height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel); font-weight: 700; font-size: 14px;
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.select { padding-right: 10px; }
.select option { background: var(--panel); }
.btn:hover { background: var(--panel2); border-color: var(--purple); }
.btn.primary { background: var(--grad); border-color: transparent; box-shadow: var(--glow); color: #fff; }
.btn.primary:hover { filter: brightness(1.12); }
.btn.danger { border-color: rgba(244, 63, 94, .5); color: #fda4af; }
.btn.danger:hover { background: rgba(244, 63, 94, .15); border-color: var(--red); }
.btn.big { height: 48px; padding: 0 24px; font-size: 16px; border-radius: 12px; }
.btn .ic { width: 18px; height: 18px; }
.btn.on { color: var(--pink); border-color: var(--pink); }

/* ---------------- game grid + cards ---------------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 16px; }
.grid.lg { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.row-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 220px); gap: 16px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.row-scroll > * { scroll-snap-align: start; }
.card { position: relative; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); overflow: hidden; transition: transform .16s, box-shadow .16s, border-color .16s; }
.card:hover { transform: translateY(-4px); border-color: var(--line2); box-shadow: 0 14px 30px rgba(0, 0, 0, .45), var(--glow); }
.card-link { display: block; }
.thumb { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #0d0b24; }
.thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
.card:hover .thumb img { transform: scale(1.06); }
.play-hover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8, 6, 24, .45); opacity: 0; transition: opacity .16s; }
.play-hover .ic { width: 50px; height: 50px; padding: 14px; border-radius: 50%; background: var(--grad); box-shadow: var(--glow); color: #fff; }
.card:hover .play-hover, .card-link:focus-visible .play-hover { opacity: 1; }
.card-body { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 12px; }
.card-title { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 26px; }
.card-cat { font-size: 12px; font-weight: 700; color: var(--c); opacity: .9; }
.badge { position: absolute; top: 9px; left: 9px; font-size: 10.5px; font-weight: 900; letter-spacing: 1px; padding: 3px 8px; border-radius: 6px; color: #fff; }
.badge.new { background: linear-gradient(135deg, #06b6d4, #3b82f6); box-shadow: 0 0 12px rgba(34, 211, 238, .6); }
.badge.hot { background: linear-gradient(135deg, #f43f5e, #f97316); box-shadow: 0 0 12px rgba(244, 63, 94, .5); }
.rank { position: absolute; top: 8px; left: 8px; min-width: 34px; height: 30px; padding: 0 8px; border-radius: 9px; display: grid; place-items: center; font-weight: 900; font-size: 15px; font-style: italic; background: rgba(7, 7, 26, .8); border: 1px solid var(--line2); color: #fff; text-shadow: 0 0 10px var(--purple); }
.fav-btn { position: absolute; right: 8px; bottom: 9px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 0; background: transparent; color: var(--dim); }
.fav-btn .ic { width: 18px; height: 18px; }
.fav-btn:hover { color: var(--pink); background: rgba(244, 114, 182, .12); }
.fav-btn.on { color: var(--pink); filter: drop-shadow(0 0 6px rgba(244, 114, 182, .7)); }

/* ---------------- hero (featured) ---------------- */
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; margin-bottom: 34px; }
.slides { position: relative; border-radius: 20px; overflow: hidden; border: 1px solid var(--line2); background: var(--panel); min-height: 330px; box-shadow: 0 20px 50px rgba(0, 0, 0, .4); }
.slide { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1.1fr; align-items: center; opacity: 0; visibility: hidden; transition: opacity .5s, visibility .5s; }
.slide.on { opacity: 1; visibility: visible; }
.slide-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(30px) saturate(1.4); opacity: .35; transform: scale(1.2); }
.slide-info { position: relative; padding: 30px 10px 50px 34px; }
.slide-kicker { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; letter-spacing: 1.5px; color: var(--cyan); text-transform: uppercase; }
.slide-kicker .ic { width: 15px; height: 15px; }
.slide h2 { margin: 8px 0 8px; font-size: clamp(28px, 3.4vw, 46px); line-height: 1.05; font-weight: 900; font-style: italic; background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.slide p { margin: 0 0 18px; color: #c9cbef; max-width: 460px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.slide .tags { margin-bottom: 18px; }
.slide-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.slide-art { position: relative; height: 100%; display: flex; align-items: center; padding: 22px 22px 22px 0; }
.slide-art img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 16px; border: 1px solid var(--line2); box-shadow: 0 0 40px rgba(124, 58, 237, .5); }
.slide-nav { position: absolute; left: 34px; bottom: 18px; display: flex; gap: 8px; align-items: center; z-index: 2; }
.dot { width: 9px; height: 9px; border-radius: 9px; border: 0; padding: 0; background: rgba(255, 255, 255, .25); transition: width .25s, background .25s; }
.dot.on { width: 26px; background: var(--grad); }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line2); background: rgba(8, 8, 26, .7); display: grid; place-items: center; opacity: 0; transition: opacity .2s; }
.slides:hover .arrow, .arrow:focus-visible { opacity: 1; }
.arrow.l { left: 10px; } .arrow.r { right: 10px; }
.hero-side { display: flex; flex-direction: column; gap: 16px; }
.mini { position: relative; flex: 1; display: flex; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); min-height: 150px; }
.mini img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; transition: transform .3s; }
.mini:hover img { transform: scale(1.06); }
.mini:hover { border-color: var(--line2); box-shadow: var(--glow); }
.mini span { position: relative; margin-top: auto; width: 100%; padding: 30px 14px 12px; background: linear-gradient(rgba(5, 4, 15, 0), rgba(5, 4, 15, .97) 45%); font-weight: 850; display: flex; justify-content: space-between; align-items: center; }
.mini small { color: var(--cyan); font-weight: 700; font-size: 12px; }

.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 750; color: var(--c, #e9d5ff); background: color-mix(in srgb, var(--c, #a855f7) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c, #a855f7) 40%, transparent); }
.tag .ic { width: 14px; height: 14px; }
a.tag:hover { background: color-mix(in srgb, var(--c, #a855f7) 26%, transparent); }

/* ---------------- category tiles ---------------- */
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.cat-tile { position: relative; display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); font-weight: 800; transition: transform .15s, border-color .15s, box-shadow .15s; }
.cat-tile::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120px 80px at 0% 0%, color-mix(in srgb, var(--c) 30%, transparent), transparent); }
.cat-tile .ic { position: relative; width: 38px; height: 38px; padding: 8px; border-radius: 11px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); flex: none; }
.cat-tile span { position: relative; display: flex; flex-direction: column; line-height: 1.2; }
.cat-tile small { color: var(--muted); font-weight: 600; font-size: 12px; }
.cat-tile:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c) 60%, transparent); box-shadow: 0 0 22px color-mix(in srgb, var(--c) 30%, transparent); }

/* ---------------- empty states ---------------- */
.empty { text-align: center; padding: 50px 20px; border-radius: 18px; border: 1px dashed var(--line2); background: rgba(17, 17, 44, .5); color: var(--muted); }
.empty .ic { width: 46px; height: 46px; color: var(--purple); margin-bottom: 8px; }
.empty h3 { margin: 0 0 6px; color: #fff; font-size: 20px; }
.empty p { margin: 0 0 16px; }

/* ---------------- play page ---------------- */
.crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin-bottom: 14px; }
.crumbs a:hover { color: #fff; }
.crumbs .ic { width: 14px; height: 14px; color: var(--dim); }
.play-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.player-wrap { border-radius: 18px; overflow: hidden; background: #000; border: 1px solid var(--line2); box-shadow: 0 20px 50px rgba(0, 0, 0, .5), 0 0 40px rgba(124, 58, 237, .25); }
.player { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - var(--top) - 150px); margin: 0 auto; background: #05040f; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #05040f; }
.splash { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; cursor: pointer; overflow: hidden; border: 0; width: 100%; padding: 20px; background: #05040f; color: #fff; }
.splash-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(18px) brightness(.55) saturate(1.3); transform: scale(1.15); }
.splash > *:not(.splash-bg) { position: relative; }
.splash img { width: min(200px, 34%); aspect-ratio: 1/1; object-fit: cover; border-radius: 14px; border: 1px solid var(--line2); box-shadow: 0 0 30px rgba(124, 58, 237, .6); }
.splash h2 { margin: 0; font-size: clamp(20px, 3vw, 32px); font-weight: 900; font-style: italic; }
.play-big { display: inline-flex; align-items: center; gap: 10px; padding: 13px 34px; border-radius: 999px; background: var(--grad); box-shadow: var(--glow); font-weight: 900; font-size: 18px; letter-spacing: 1px; transition: transform .15s; }
.splash:hover .play-big { transform: scale(1.06); }
.play-big .ic { width: 20px; height: 20px; }
.player-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; background: var(--panel); border-top: 1px solid var(--line); }
.player-bar h1 { margin: 0; font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
.player-bar h1 img { width: 40px; height: 30px; object-fit: cover; border-radius: 6px; }
.player-bar .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.player-bar .btn { height: 36px; padding: 0 12px; }
.info { margin-top: 18px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.panel h3 { margin: 0 0 10px; font-size: 16px; font-weight: 850; display: flex; align-items: center; gap: 8px; }
.panel h3 .ic { width: 18px; height: 18px; color: var(--purple); }
.panel p { margin: 0 0 12px; color: #c9cbef; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; margin: 0; }
.meta dt { color: var(--dim); font-weight: 700; }
.meta dd { margin: 0; color: #d6d8f6; }
.side-list { display: flex; flex-direction: column; gap: 10px; }
.side-list h3 { margin: 0 0 4px; font-size: 16px; font-weight: 850; }
.s-item { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); transition: border-color .15s, background .15s; }
.s-item:hover { border-color: var(--line2); background: var(--panel2); }
.s-item img { width: 92px; height: 69px; object-fit: cover; border-radius: 9px; flex: none; }
.s-item b { display: block; font-size: 14.5px; }
.s-item small { color: var(--muted); font-size: 12px; }
/* pseudo fullscreen (iOS / unsupported) */
.player-wrap.fake-fs { position: fixed; inset: 0; z-index: 100; border-radius: 0; border: 0; display: flex; flex-direction: column; }
.player-wrap.fake-fs .player { flex: 1; aspect-ratio: auto; max-height: none; }
.player-wrap:fullscreen { border-radius: 0; border: 0; display: flex; flex-direction: column; width: 100%; height: 100%; }
.player-wrap:fullscreen .player { flex: 1; aspect-ratio: auto; max-height: none; }
.player-wrap:-webkit-full-screen { width: 100%; height: 100%; display: flex; flex-direction: column; }
.player-wrap:-webkit-full-screen .player { flex: 1; aspect-ratio: auto; max-height: none; }
.fs-exit { display: none; }
.fake-fs .fs-exit { display: inline-flex; }
body.theater .play-layout { grid-template-columns: 1fr; }
body.theater .play-side { display: none; }

/* ---------------- toasts ---------------- */
.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line2); box-shadow: 0 10px 30px rgba(0, 0, 0, .5), var(--glow); font-size: 14px; opacity: 0; transform: translateY(10px); transition: opacity .25s, transform .25s; }
.toast.in { opacity: 1; transform: none; }
.toast .ic { color: var(--pink); width: 18px; height: 18px; }

/* ---------------- footer ---------------- */
.site-footer { border-top: 1px solid var(--line); background: rgba(8, 8, 24, .7); }
.foot-inner { max-width: 1640px; padding: 26px; display: grid; gap: 10px; }
.foot-inner p { margin: 0; color: var(--muted); max-width: 640px; font-size: 14px; }
.foot-inner nav { display: flex; gap: 18px; flex-wrap: wrap; font-weight: 700; font-size: 14px; }
.foot-inner nav a { color: #c4b5fd; }
.foot-inner nav a:hover { color: #fff; }
.foot-inner small { color: var(--dim); font-size: 12.5px; }

/* ---------------- admin ---------------- */
.admin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.stat b { display: block; font-size: 28px; font-weight: 900; background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat span { color: var(--muted); font-size: 13px; font-weight: 700; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: rgba(34, 211, 238, .07); border: 1px solid rgba(34, 211, 238, .3); color: #cdeff7; font-size: 14px; margin-bottom: 20px; }
.notice .ic { color: var(--cyan); margin-top: 2px; }
.notice.warn { background: rgba(245, 158, 11, .08); border-color: rgba(245, 158, 11, .35); color: #fde7c0; }
.notice.warn .ic { color: #f59e0b; }
.table-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); font-weight: 800; background: rgba(255, 255, 255, .02); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
tr:hover td { background: rgba(124, 58, 237, .05); }
td.g { display: flex; align-items: center; gap: 12px; min-width: 220px; }
td.g img { width: 64px; height: 48px; object-fit: cover; border-radius: 8px; flex: none; }
td.g b { display: block; }
td.g small { color: var(--dim); font-size: 12px; }
td .tags { max-width: 260px; }
.acts-cell { display: flex; gap: 6px; justify-content: flex-end; }
.acts-cell .icon-btn { width: 34px; height: 34px; }
.acts-cell .icon-btn .ic { width: 17px; height: 17px; }
.acts-cell .icon-btn.del:hover { color: var(--red); border-color: var(--red); }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch i { position: absolute; inset: 0; border-radius: 22px; background: #2a2a55; transition: background .2s; cursor: pointer; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked + i { background: var(--grad); box-shadow: var(--glow); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 2px solid var(--cyan); outline-offset: 2px; }
.modal { position: fixed; inset: 0; z-index: 150; display: none; align-items: flex-start; justify-content: center; padding: 30px 16px; background: rgba(3, 3, 12, .75); backdrop-filter: blur(4px); overflow-y: auto; }
.modal.open { display: flex; }
.modal-box { width: 100%; max-width: 760px; background: var(--panel); border: 1px solid var(--line2); border-radius: 20px; box-shadow: 0 30px 80px rgba(0, 0, 0, .7), var(--glow); }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 20px; font-weight: 900; }
.modal-head .icon-btn { margin-left: auto; }
.modal-body { padding: 18px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1 / -1; }
.field label, .field .lbl { font-size: 13px; font-weight: 800; color: #d6d8f6; }
.field .hint { font-size: 12px; color: var(--dim); }
.input, textarea.input { width: 100%; min-height: 40px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg2); outline: none; }
textarea.input { resize: vertical; min-height: 84px; }
.input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(168, 85, 247, .18); }
.input.bad { border-color: var(--red); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line2); background: var(--bg2); font-size: 13px; font-weight: 700; cursor: pointer; user-select: none; }
.check input { accent-color: var(--purple); }
.check:has(input:checked) { background: rgba(124, 58, 237, .25); border-color: var(--purple); }
.thumb-edit { display: flex; gap: 14px; align-items: flex-start; }
.thumb-edit img { width: 160px; height: 120px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line2); flex: none; }
.thumb-edit .stack { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.row-flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.err { color: #fda4af; font-size: 13px; font-weight: 700; grid-column: 1 / -1; }
.gate { max-width: 420px; margin: 8vh auto; text-align: center; }
.gate .panel { padding: 30px; }
.gate .ic.big { width: 48px; height: 48px; color: var(--purple); }
.gate h1 { margin: 10px 0 6px; font-size: 24px; }
.gate p { color: var(--muted); font-size: 14px; }
.gate form { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.pin { text-align: center; font-size: 22px; letter-spacing: 8px; font-weight: 900; }

/* ---------------- responsive ---------------- */
@media (max-width: 1280px) {
  .hero { grid-template-columns: 1fr; }
  .hero-side { flex-direction: row; }
  .play-layout { grid-template-columns: 1fr; }

  .top-btn span { display: none; }

}
@media (max-width: 720px) {
  :root { --top: 113px; }
  .topbar { flex-wrap: wrap; height: auto; min-height: var(--top); padding: 10px 16px; gap: 10px 10px; align-content: center; }
  .search { order: 3; flex: 1 0 100%; max-width: none; }
  .top-actions { margin-left: auto; }
  .logo-text { font-size: 18px; }
  .kbd-hint { display: none; }
  main { padding: calc(var(--top) + 14px) 16px 24px; }
  .slides { min-height: 0; }
  .slide { position: relative; grid-template-columns: 1fr; display: none; }
  .slide.on { display: grid; }
  .slide-art { order: -1; padding: 14px 14px 0; height: auto; }
  .slide-info { padding: 16px 18px 48px; }
  .slide-nav { left: 18px; }
  .arrow { opacity: 1; top: 30%; }
  .hero-side { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .card-title { font-size: 14px; }

  .player-bar .acts .lbl { display: none; }
  .player { max-height: none; }
  .modal-body { grid-template-columns: 1fr; }
  .thumb-edit { flex-direction: column; }
  .foot-inner { padding: 20px 16px; }
}
@media (max-width: 480px) {
  .top-actions { gap: 2px; }
  .top-btn { width: 36px; padding: 0; justify-content: center; }
  .logo { gap: 7px; }
  .logo-mark { width: 32px; height: 32px; }
  .logo-text { font-size: 17px; }

}
@media (max-width: 380px) {
  .logo-text { font-size: 15px; }
  .logo-mark { width: 28px; height: 28px; }
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}


/* ===========================================================
   gn-style hub layout: square tiles, collapsible zones, viewer
   =========================================================== */
body { background: radial-gradient(1000px 420px at 50% -120px, rgba(124, 58, 237, .22), transparent 70%), var(--bg); }
.sidebar, .scrim, .menu-btn { display: none !important; }
main { margin: 0 auto; max-width: 1360px; padding-left: 32px; padding-right: 32px; }
.site-footer { margin-left: 0; }
.foot-inner { margin: 0 auto; max-width: 1360px; padding-left: 32px; padding-right: 32px; }

/* hub header */
.hub-head { text-align: center; padding: 18px 0 8px; }
.hub-title { margin: 0; font-size: clamp(34px, 6vw, 64px); font-weight: 900; font-style: italic; letter-spacing: 1px; line-height: 1.05;
  background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(168, 85, 247, .45)); }
.hub-title span { -webkit-text-fill-color: var(--cyan); }
.hub-title em { -webkit-text-fill-color: #fff; text-shadow: 0 0 18px rgba(96, 165, 250, .7); }
.hub-sub { margin: 6px 0 18px; color: var(--muted); font-size: 14.5px; }
.hub-tools { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
.hub-search { position: relative; flex: 1 1 340px; max-width: 520px; display: flex; align-items: center; }
.hub-search .ic { position: absolute; left: 13px; color: var(--muted); pointer-events: none; }
.hub-search input { width: 100%; height: 42px; padding: 0 14px 0 42px; border-radius: 10px; border: 1px solid #34344a; background: var(--panel); outline: none; }
.hub-search input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(168, 85, 247, .2); }
.hub-tools .select { height: 42px; border-color: #34344a; }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid #34344a; background: var(--panel); font-size: 13.5px; font-weight: 750; color: #d4d5ee; }
.chip .ic { width: 16px; height: 16px; color: var(--c, var(--muted)); }
.chip:hover { border-color: var(--c, var(--purple)); color: #fff; }
.chip.on { background: var(--grad); border-color: transparent; color: #fff; box-shadow: var(--glow); }
.chip.on .ic { color: #fff; }
.chip.fav .ic { color: var(--pink); }

/* collapsible zones */
.zone { margin: 26px 0 0; }
.zone > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; padding: 6px 2px; margin-bottom: 14px; user-select: none; }
.zone > summary::-webkit-details-marker { display: none; }
.zone > summary .caret { display: inline-block; font-size: 15px; color: var(--purple); transition: transform .15s; }
.zone:not([open]) > summary .caret { transform: rotate(-90deg); }
.zone > summary:hover { color: #fff; }
.zone-count { color: var(--muted); font-weight: 650; }
.zone-link { margin-left: auto; font-size: 13.5px; font-weight: 700; color: var(--cyan); background: none; border: 0; padding: 0; }
.zone-link:hover { text-decoration: underline; }
.zone-link.danger { color: #fda4af; }

/* square tiles */
.grid { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 22px; }
.card { background: #23232c; border: 1px solid #34344a; border-radius: 10px; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
.card:hover { transform: translateY(-4px); border-color: var(--purple); box-shadow: 0 10px 26px rgba(0, 0, 0, .5), 0 0 20px rgba(168, 85, 247, .35); }
.thumb { aspect-ratio: 1 / 1; border-radius: 9px 9px 0 0; }
.card-body { align-items: center; text-align: center; justify-content: center; min-height: 66px; padding: 10px 12px 12px; gap: 3px; }
.card-title { white-space: normal; padding: 0; font-size: 14.5px; line-height: 1.25; font-weight: 800; color: #f1f1ff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-cat { font-size: 11.5px; color: var(--muted); font-weight: 650; }
.fav-btn { top: 8px; right: 8px; bottom: auto; background: rgba(10, 10, 20, .65); color: #fff; opacity: 0; transition: opacity .15s; }
.card:hover .fav-btn, .fav-btn.on, .fav-btn:focus-visible { opacity: 1; }
.fav-btn:hover { background: rgba(10, 10, 20, .85); }
@media (hover: none) { .fav-btn { opacity: 1; } }
.cats { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); }
.empty { padding: 36px 20px; }

/* in-page game viewer */
body.viewing { overflow: hidden; }
.viewer { position: fixed; inset: 0; z-index: 120; display: flex; flex-direction: column; background: #0a0a10; }
.viewer[hidden] { display: none; }
.viewer-bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #17171f; border-bottom: 1px solid #2c2c40; flex-wrap: wrap; }
.viewer-bar > img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
.vt b { display: block; font-size: 17px; font-weight: 850; }
.vt small { color: var(--muted); font-size: 12px; }
.viewer-bar .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.viewer-bar .btn { height: 36px; padding: 0 12px; }
.viewer-bar .close { width: 36px; height: 36px; }
.viewer-bar .close:hover { border-color: var(--red); color: #fda4af; }
.viewer-stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; background: #000; }
.viewer-frame { position: relative; width: min(100%, calc((100vh - 110px) * var(--ar))); width: min(100%, calc((100dvh - 110px) * var(--ar))); aspect-ratio: var(--ar); max-height: 100%; }
.viewer-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #05040f; border-radius: 6px; }
.viewer-stage:fullscreen { padding: 0; }
.viewer-stage:fullscreen .viewer-frame { width: min(100vw, calc(100vh * var(--ar))); }
.viewer-info { padding: 12px 18px; background: #17171f; border-top: 1px solid #2c2c40; font-size: 14px; color: #c9cbef; }
.viewer-info p { margin: 0 0 6px; }
.viewer-info .ctl { display: flex; gap: 8px; align-items: center; color: var(--muted); margin: 0; }
.viewer-info .ctl .ic { width: 16px; height: 16px; color: var(--purple); }
.max-exit { display: none; position: absolute; top: 10px; right: 10px; z-index: 3; width: 38px; height: 38px; border-radius: 10px; border: 1px solid #34344a; background: rgba(10, 10, 20, .7); color: #fff; align-items: center; justify-content: center; }
.viewer.max .viewer-bar, .viewer.max .viewer-info { display: none; }
.viewer.max .viewer-stage { padding: 0; }
.viewer.max .viewer-frame { width: min(100vw, calc(100dvh * var(--ar))); }
.viewer.max .max-exit, .viewer-stage:fullscreen .max-exit { display: inline-flex; }

/* play page tweaks for square thumbs */
.player-bar h1 img { width: 34px; height: 34px; }
.s-item img { width: 64px; height: 64px; }
.sug img { width: 48px; height: 48px; }
td.g img { width: 52px; height: 52px; }
.thumb-edit img { width: 140px; height: 140px; }
.mini img { object-position: center; }

@media (max-width: 720px) {
  main { padding-left: 16px; padding-right: 16px; }
  .foot-inner { padding-left: 16px; padding-right: 16px; }
  .top-btn[href$="#/"], .top-btn[href="admin.html"] { display: none; }
  .grid, .cats { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .hub-head { padding-top: 8px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding-bottom: 6px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .chip { flex: none; }
  .zone > summary { font-size: 18px; }
  .viewer-bar { padding: 8px 10px; gap: 8px; }
  .viewer-bar .lbl { display: none; }
  .viewer-bar .acts { gap: 6px; }
  .viewer-stage { padding: 0; }
  .vt b { font-size: 15px; }
}
@media (max-width: 380px) { .grid, .cats { grid-template-columns: repeat(2, 1fr); } }

.card-body { min-height: 54px; }
.credit { color: var(--muted); font-size: 13px; margin: 6px 0 0 !important; }
.credit a { color: var(--cyan); }
.credit a:hover { text-decoration: underline; }

/* ===========================================================
   Plain look (matches the classic zone-list style)
   =========================================================== */
:root {
  --bg: #1c1c1c; --bg2: #242424; --panel: #2a2a2a; --panel2: #333; --panel3: #3a3a3a;
  --line: #333; --line2: #444; --text: #f2f2f2; --muted: #a8a8a8; --dim: #7a7a7a;
  --purple: #d0d0d0; --violet: #bbb; --blue: #8ab4f8; --cyan: #8ab4f8; --pink: #ff6b8b;
  --grad: #3c3c3c; --grad-text: linear-gradient(#fff, #fff); --glow: none;
  --font: Arial, Helvetica, sans-serif; --top: 72px;
}
body { background: var(--bg); font-family: var(--font); }
.topbar { background: #0e0e0e; border-bottom: 1px solid #262626; backdrop-filter: none; -webkit-backdrop-filter: none; gap: 14px; padding: 0 max(18px, env(safe-area-inset-right, 0px)) 0 max(18px, env(safe-area-inset-left, 0px)); }
.topbar::after { display: none; }
.brand { font-family: "Arial Black", Arial, Helvetica, sans-serif; font-weight: 900; font-size: 30px; letter-spacing: .5px; color: #e9e9e9; white-space: nowrap; flex: none; }
.hdr-tools { display: flex; gap: 8px; margin-left: auto; align-items: center; flex: 0 1 auto; min-width: 0; }
.hdr-tools input, .hdr-tools select { height: 34px; border-radius: 4px; border: 1px solid #bbb; background: #fff; color: #111; font: 14px Arial, Helvetica, sans-serif; padding: 0 10px; }
.hdr-tools input { width: 220px; min-width: 0; }
.hdr-tools input::placeholder { color: #8a8a8a; }
.hdr-tools input:focus, .hdr-tools select:focus { outline: 2px solid #8ab4f8; outline-offset: 0; }
.hdr-link { color: #eee; font-size: 14px; white-space: nowrap; flex: none; margin-left: 10px; }
.hdr-link:hover { text-decoration: underline; }

main { max-width: 1400px; padding-top: calc(var(--top) + 18px); }
.zone { margin: 22px 0 0; }
.zone > summary { font-size: 18px; font-weight: 700; margin-bottom: 14px; gap: 6px; }
.zone > summary .caret { color: #eee; font-size: 12px; }
.zone-count { color: #eee; font-weight: 700; }
.grid { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 18px; }
.card { background: #2a2a2a; border: 1px solid #383838; border-radius: 8px; box-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
.card:hover { transform: translateY(-3px); border-color: #555; box-shadow: 0 6px 16px rgba(0, 0, 0, .5); }
.card:hover .thumb img { transform: none; }
.thumb { border-radius: 7px 7px 0 0; background: #111; }

/* message shown when a page blocks outside games */

/* live event */
.event-card { position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin: 4px 0 20px; padding: 18px 20px 22px;
  background: linear-gradient(135deg, #1b1630 0%, #141414 60%); border: 1px solid #2f2a45; border-radius: 14px; }
.event-card.ph-live { background: linear-gradient(135deg, #3a0f14 0%, #1a1012 60%); border-color: #ff3b3b; box-shadow: 0 0 0 1px #ff3b3b inset, 0 0 30px rgba(255, 59, 59, .3); }
.event-card.ph-over { background: #151515; border-color: #2a2a2a; }
.ev-main { display: flex; align-items: center; gap: 14px; flex: 1 1 280px; min-width: 0; }
.ev-icon { width: 68px; height: 68px; border-radius: 12px; object-fit: cover; flex: none; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.ev-info { min-width: 0; }
.ev-badge { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px; background: #2b2640; color: #fff; font: 800 11px/1 Arial, sans-serif; letter-spacing: .1em; }
.ev-badge i { width: 8px; height: 8px; border-radius: 50%; background: #ff3b3b; }

.ph-over .ev-badge { background: #2a2a2a; }
.ph-over .ev-badge i { background: #777; }
.ph-paused .ev-badge i { background: #ffd23f; }
@keyframes evPulse { 50% { opacity: .25; } }
.ev-name { margin: 8px 0 2px; font: 900 22px/1.15 'Arial Black', Arial, sans-serif; color: #fff; overflow-wrap: anywhere; }
.ev-sub { margin: 0; color: #aaa; font-size: 13px; }
.ev-sub b { color: #ddd; }
.ev-clockwrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ev-label { color: #aaa; font: 700 11px/1 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
.ph-live .ev-label { color: #ff8a8a; }
.ev-clock { display: flex; align-items: flex-start; gap: 6px; }

.ev-seg small { margin-top: 4px; color: #888; font: 700 10px/1 Arial, sans-serif; letter-spacing: .12em; }
.ph-live .ev-seg { border-color: #ff3b3b; background: #1a0b0d; }
.ph-live .ev-seg b { color: #ff5b5b; }
.ev-colon { font: 900 28px/1.4 Arial, sans-serif; color: #555; }
.ev-acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ev-acts .btn svg, .ev-play svg { width: 16px; height: 16px; }
.ev-acts .icon-btn svg { width: 18px; height: 18px; }
.event-card .btn.ev-play { font-size: 18px; font-weight: 800; padding: 14px 28px; background: #ff3b3b; color: #fff; border-color: #ff3b3b; animation: evGlow 1.4s infinite; }

@keyframes evGlow { 50% { box-shadow: 0 0 0 6px rgba(255, 59, 59, .25); } }
.ev-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255,255,255,.06); }
.ev-bar i { display: block; height: 100%; background: linear-gradient(90deg, #7c5cff, #3b8bff); transition: width .25s linear; }
.ph-live .ev-bar i { background: linear-gradient(90deg, #ff3b3b, #ffd23f); }
.ev-confetti { position: absolute; inset: 0; pointer-events: none; }
.ev-confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: evFall 2s ease-in forwards; }
@keyframes evFall { to { transform: translate(var(--dx), 260px) rotate(var(--r)); opacity: 0; } }
@media (max-width: 700px) {
  .event-card { padding: 16px 14px 20px; gap: 14px; }

/* black hole live event */
html.bh-root, html.bh-root body { overflow: hidden; overscroll-behavior: none; }
body.bh-on { overflow: hidden; }
body.bh-on .topbar, body.bh-on #view { contain: paint; }
body.bh-suck .topbar, body.bh-suck #view, body.fx-out-suck .topbar, body.fx-out-suck #view { animation: bhSuck 2.6s cubic-bezier(.55, 0, .85, .35) forwards; pointer-events: none; }
@keyframes bhSuck { 0% { transform: none; filter: none; opacity: 1; } 70% { opacity: 1; } 100% { transform: scale(.01) rotate(600deg); filter: blur(8px); opacity: 0; } }
body.bh-return .topbar, body.bh-return #view { animation: bhBack .9s cubic-bezier(.2, .7, .3, 1) both; }
@keyframes bhBack { 0% { transform: scale(.01) rotate(-300deg); filter: blur(8px); opacity: 0; } 100% { transform: none; filter: none; opacity: 1; } }
.bh { position: fixed; inset: 0; z-index: 9000; }
.bh-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bh-ui { position: absolute; left: 0; right: 0; bottom: max(7vh, 32px); display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 0 16px; text-align: center;
  opacity: 0; transform: translateY(16px); transition: opacity .9s, transform .9s; pointer-events: none; }
.bh.bh-show .bh-ui { opacity: 1; transform: none; pointer-events: auto; }
.bh.bh-leaving .bh-ui { opacity: 0; transition-duration: .3s; }
.bh-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #ff3b3b; color: #fff; font: 800 12px/1 Arial, sans-serif; letter-spacing: .12em; }
.bh-badge i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: evPulse 1s infinite; }
.bh-title { margin: 0; color: #fff; font: 900 clamp(28px, 6vw, 64px)/1.05 'Arial Black', Arial, sans-serif; letter-spacing: .05em; text-shadow: 0 0 28px rgba(255, 150, 70, .65); }
.bh-sub { margin: 0; color: #c9c9c9; font-size: 16px; }
.bh-sub b { color: #fff; }
.bh-acts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.bh-btn { padding: 14px 26px; border-radius: 999px; border: 1px solid #555; background: rgba(255, 255, 255, .08); color: #fff; font: 800 16px/1 Arial, sans-serif; cursor: pointer; }
.bh-btn:hover { background: rgba(255, 255, 255, .16); }
.bh-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.bh-play { background: #ff3b3b; border-color: #ff3b3b; }
.bh-play:hover { background: #ff5555; }
.event-card .btn.ev-bh { background: #000; color: #fff; border-color: #ff8a3d; box-shadow: 0 0 14px rgba(255, 138, 61, .35); }
@media (prefers-reduced-motion: reduce) { .bh-badge i { animation: none; } }

/* more live events: how the page leaves the screen */
body.fx-out-drop .topbar, body.fx-out-drop #view { animation: fxDrop 2.6s linear forwards; pointer-events: none; }
@keyframes fxDrop {
  0% { transform: none; } 10% { transform: translate(2px, -1px); } 20% { transform: translate(-3px, 2px); } 30% { transform: translate(4px, -2px); }
  40% { transform: translate(-5px, 3px); } 50% { transform: translate(6px, -3px); } 60% { transform: translate(-7px, 4px); } 70% { transform: translate(8px, -4px); }
  80% { transform: translate(-9px, 5px); } 92% { transform: translate(0, 0); opacity: 1; filter: none; }
  100% { transform: translateY(70vh) rotate(6deg) scale(.9); opacity: 0; filter: blur(4px) sepia(1) saturate(3) hue-rotate(-20deg); }
}
body.fx-out-rift .topbar, body.fx-out-rift #view { animation: fxRift 2.4s cubic-bezier(.6, 0, .9, .4) forwards; pointer-events: none; }
@keyframes fxRift { 0% { transform: none; filter: none; opacity: 1; } 60% { transform: scaleX(.85) skewY(2deg); filter: hue-rotate(80deg) saturate(1.6); opacity: 1; } 100% { transform: scaleX(0) scaleY(1.1); filter: hue-rotate(140deg) blur(8px); opacity: 0; } }
body.fx-out-glitch .topbar, body.fx-out-glitch #view { animation: fxGlitch 2.2s steps(1, end) forwards; pointer-events: none; }
@keyframes fxGlitch {
  0% { transform: none; } 8% { transform: translate(-6px, 0); clip-path: inset(10% 0 60% 0); } 12% { transform: translate(5px, 2px); clip-path: none; filter: hue-rotate(90deg); }
  20% { transform: translate(0); filter: none; } 28% { transform: translate(8px, -2px) skewX(6deg); clip-path: inset(40% 0 30% 0); } 34% { transform: none; clip-path: none; }
  45% { transform: translate(-10px, 3px); filter: hue-rotate(200deg) saturate(2); } 52% { transform: none; filter: none; } 60% { transform: translate(12px, 0) skewX(-8deg); clip-path: inset(0 0 70% 0); }
  66% { transform: none; clip-path: inset(30% 0 20% 0); filter: hue-rotate(260deg); } 74% { transform: translate(-14px, -4px); clip-path: none; filter: none; }
  82% { transform: translate(6px, 0); clip-path: inset(55% 0 5% 0); } 90% { transform: none; clip-path: inset(48% 0 48% 0); opacity: .8; } 100% { clip-path: inset(50% 0 50% 0); opacity: 0; }
}
body.fx-out-freeze .topbar, body.fx-out-freeze #view { animation: fxFreeze 2.8s ease-in forwards; pointer-events: none; }
@keyframes fxFreeze { 0% { filter: none; transform: none; opacity: 1; } 75% { filter: grayscale(.7) brightness(1.15) sepia(.3) hue-rotate(170deg) contrast(1.1); transform: none; opacity: 1; } 100% { filter: grayscale(1) brightness(1.4) hue-rotate(170deg) blur(2px); transform: scale(1.03); opacity: 0; } }
body.fx-return .topbar, body.fx-return #view { animation: fxBack .8s cubic-bezier(.2, .7, .3, 1) both; }
@keyframes fxBack { 0% { transform: scale(.92); filter: blur(6px); opacity: 0; } 100% { transform: none; filter: none; opacity: 1; } }
/* per-event colors */
.fx-meteor .bh-title { text-shadow: 0 0 28px rgba(255, 120, 40, .8); }
.fx-rift .bh-title { text-shadow: 0 0 28px rgba(140, 100, 255, .9), 0 0 8px rgba(120, 220, 255, .8); }
.fx-rift .bh-badge, .fx-rift .bh-play { background: #7c4dff; border-color: #7c4dff; }
.fx-glitch .bh-title { font-family: ui-monospace, Consolas, monospace; color: #e8fbff; text-shadow: -3px 0 rgba(0, 240, 255, .9), 3px 0 rgba(255, 0, 170, .9); min-height: 1.05em; }
.fx-glitch .bh-badge, .fx-glitch .bh-play { background: #00b8d4; border-color: #00b8d4; color: #001014; }
.fx-glitch .bh-badge i { background: #001014; }
.fx-freeze .bh-title { color: #f0fbff; text-shadow: 0 0 28px rgba(120, 200, 255, .9); }

/* event lineup on the card */
.ev-lineup { flex-basis: 100%; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-top: -2px; }
.ev-lineup > span:not(.ev-chip) { color: #888; font: 700 11px/1 Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; margin-right: 2px; }
.ev-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid #333; background: #111; color: #ddd; font: 600 12px/1 Arial, sans-serif; cursor: pointer; }
button.ev-chip:hover { border-color: #666; color: #fff; }
span.ev-chip { cursor: default; }
.ev-chip.on { border-color: #ff8a3d; color: #fff; background: #1d130c; }
.ev-chip small { color: #ff8a3d; font-weight: 800; letter-spacing: .06em; }
@media (prefers-reduced-motion: reduce) { body.fx-out-drop .topbar, body.fx-out-drop #view, body.fx-out-rift .topbar, body.fx-out-rift #view, body.fx-out-glitch .topbar, body.fx-out-glitch #view, body.fx-out-freeze .topbar, body.fx-out-freeze #view { animation: none; } }

.fx-glitch .bh-ui { padding: 26px 16px 30px; background: radial-gradient(ellipse 60% 70% at 50% 55%, rgba(0, 0, 0, .9) 0%, rgba(0, 0, 0, .7) 55%, rgba(0, 0, 0, 0) 100%); }

/* big close button in the corner while a game is full screen */
.max-exit { top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: 48px; height: 48px; border-radius: 50%; z-index: 20; background: rgba(0, 0, 0, .75); border: 2px solid rgba(255, 255, 255, .85); box-shadow: 0 2px 10px rgba(0, 0, 0, .5); cursor: pointer; }

/* =================== polish: cleaner proxy look (black, white, gray) =================== */
:root { --font: "Manrope", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
body, button, input, select, textarea { font-family: var(--font); }
.px-title, .brand { font-family: var(--font); font-weight: 800; }
::selection { background: #fff; color: #000; }
html { scrollbar-color: #2a2a2a #000; scrollbar-width: thin; }
::-webkit-scrollbar { width: 8px; height: 8px; }

::-webkit-scrollbar-thumb { background: #2a2a2a; border: 0; border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: #444; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* top bar: logo left, pill links */
.topbar { gap: 10px; }
.brand { font-size: 24px; letter-spacing: 3px; }
.hdr-link { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; margin-left: 0 !important; border-radius: 17px; border: 1px solid transparent; color: #bdbdbd; font-size: 14px; font-weight: 600; transition: border-color .15s, color .15s, background-color .15s; }
.hdr-link:hover, .hdr-link:focus-visible { color: #fff; border-color: #333; background: #0b0b0b; }
.hdr-link.mu-on { color: #fff; border-color: #fff; }
.hdr-tools input, .hdr-tools select { height: 34px; border-radius: 17px; padding: 0 14px; font-family: var(--font); font-size: 13.5px; }
.hdr-tools select { padding-right: 8px; }

/* start page */
.px-title { letter-spacing: clamp(4px, 1.2vw, 12px); }
.px-sub { text-transform: uppercase; font-size: 12px; letter-spacing: 3px; font-weight: 700; color: #6f6f6f; }
.px-search { height: 60px; border-radius: 30px; }
.px-search input { font-size: 17px; font-weight: 500; }
.px-chip { padding: 8px 18px; font-weight: 600; }

/* section titles: small gray label with a divider line */
.zone { margin-top: 34px; }
.zone > summary { gap: 10px; font-size: 12.5px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: #cfcfcf; margin-bottom: 16px; }
.zone > summary::after { content: ""; flex: 1; height: 1px; background: #1f1f1f; margin-left: 6px; }
.zone > summary .caret { font-size: 10px; color: #6f6f6f; }
.zone > summary:hover, .zone > summary:hover .caret { color: #fff; }
.zone-count { color: #6f6f6f; font-weight: 700; letter-spacing: 1px; }

/* game tiles: the picture is the tile, the name sits underneath */
.grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 18px; }
.card { background: none; border: 0; border-radius: 0; box-shadow: none; overflow: visible; backdrop-filter: none; -webkit-backdrop-filter: none; }
.card:hover { transform: none; border: 0; box-shadow: none; }
.card .thumb { aspect-ratio: 1 / 1; border-radius: 18px; background: #0d0d0d; border: 1px solid #1f1f1f; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
.card:hover .thumb, .card-link:focus-visible .thumb { transform: translateY(-4px); border-color: #fff; box-shadow: 0 12px 28px rgba(0, 0, 0, .8); }
.card:hover .thumb img { transform: scale(1.05); }
.card-link:focus-visible { outline: none; }
.play-hover { background: rgba(0, 0, 0, .35); }
.play-hover .ic { width: 52px; height: 52px; padding: 16px; background: #fff; color: #000; box-shadow: none; }
.card-body { min-height: 0; padding: 10px 4px 0; align-items: flex-start; text-align: left; background: none; }
.card-title { font-size: 14px; font-weight: 700; color: #f2f2f2; line-height: 1.3; -webkit-line-clamp: 2; }
.card-cat { color: #6f6f6f; }
.fav-btn { top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0, 0, 0, .7); border: 1px solid #333; color: #fff; }
.fav-btn:hover { background: #000; border-color: #fff; color: #fff; }
.fav-btn.on { color: #fff; border-color: #fff; filter: none; }

/* footer */
.site-footer { margin-top: 48px; border-top: 1px solid #1a1a1a; background: #000; }

/* phone */

}

.topbar { background: #000; backdrop-filter: none; -webkit-backdrop-filter: none; }
/* Music panel: tabs, search, paste & play, my songs */
.mu-sp-head { align-items: center; }
.mu-sp-head b { font-size: 17px; }
.mu-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: #0b0b0b; border: 1px solid #222; }
.mu-tab { height: 36px; border-radius: 10px; border: 0; background: none; color: #a3a3a3; font-weight: 700; font-size: 14px; }

.mu-tab:not(.on):hover { color: #fff; }
.mu-body { display: flex; flex-direction: column; gap: 10px; }
.mu-find { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 4px 0 14px; border-radius: 22px; border: 1px solid #333; background: #0b0b0b; }

.mu-find .ic { width: 18px; height: 18px; color: #8a8a8a; flex: none; }

.mu-paste-row { display: flex; align-items: center; gap: 10px; }

.mu-paste-row span { color: #8a8a8a; font-size: 12px; line-height: 1.35; }

.mu-sp-chip { display: inline-flex; align-items: center; gap: 6px; }
.mu-sp-chip.mine { border-style: dashed; }
.mu-del { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #222; color: #ccc; font-size: 13px; line-height: 1; }
.mu-del:hover { background: #fff; color: #000; }
.mu-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #6f6f6f; font-size: 11.5px; }

.mu-now { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 14px; border: 1px solid #222; background: #0b0b0b; }

.mu-now-t small { color: #8a8a8a; font-size: 12px; }
.mu-now-ctrls { display: flex; align-items: center; gap: 8px; flex: none; }
.mu-play { width: 44px; height: 44px; background: #fff; color: #000; border-color: #fff; }
.mu-play:hover { background: #dcdcdc; color: #000; }
.mu-vol2 { display: flex; align-items: center; gap: 10px; color: #8a8a8a; font-size: 12px; font-weight: 700; }
.mu-vol2 input { flex: 1; accent-color: #fff; }
.mu-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow-y: auto; }
.mu-song { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border: 0; border-radius: 10px; background: none; color: #ddd; font-size: 14px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mu-song span { flex: none; width: 18px; color: #6f6f6f; font-size: 12px; font-variant-numeric: tabular-nums; }
.mu-song:hover { background: #151515; color: #fff; }
.mu-song.on { background: #1d1d1d; color: #fff; font-weight: 700; }
.mu-note, .mu-empty { margin: 0; color: #6f6f6f; font-size: 12px; line-height: 1.45; }
.mu-empty { padding: 14px 4px; font-size: 13.5px; color: #a3a3a3; text-align: center; }
@media (max-width: 600px) { .mu-paste-row { flex-direction: column; align-items: stretch; } .mu-paste-row span { text-align: center; } .mu-foot { flex-direction: column; align-items: flex-start; } }

/* cursor settings */
.cur-set { display: flex; flex-direction: column; gap: 8px; }
.cur-lbl { margin: 6px 0 0; color: #8a8a8a; font-size: 11.5px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
.cur-row { display: flex; flex-wrap: wrap; gap: 8px; }
.cur-opt { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 70px; padding: 10px 4px 8px; border-radius: 12px; border: 1px solid #333; background: #0b0b0b; color: #ccc; font-size: 12px; font-weight: 600; }
.cur-opt img { width: 28px; height: 28px; }
.cur-sys { display: grid; place-items: center; width: 28px; height: 28px; font-size: 22px; color: #fff; }
.cur-opt:hover, .cur-opt.on { border-color: #fff; color: #fff; }
.cur-sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #333; padding: 0; }
.cur-sw.on { border-color: #fff; box-shadow: 0 0 0 3px #000, 0 0 0 5px #fff; }
.cur-pill { height: 34px; padding: 0 16px; border-radius: 17px; border: 1px solid #333; background: #0b0b0b; color: #ccc; font-weight: 600; font-size: 13.5px; }
.cur-pill:hover, .cur-pill.on { border-color: #fff; color: #fff; }
.cur-pill.on { background: #fff; color: #000; }
.cur-try { margin-top: 8px; display: grid; place-items: center; height: 80px; border-radius: 12px; border: 1px dashed #333; color: #6f6f6f; font-size: 13px; }
.cur-reset { align-self: flex-start; border: 0; background: none; color: #aaa; font-size: 13px; padding: 0; text-decoration: underline; }
.cur-reset:hover { color: #fff; }
.cur-note { margin: 4px 0 0; color: #6f6f6f; font-size: 12px; }

/* cursor designer */
.cur-preview { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; padding: 16px 12px 12px; border-radius: 14px; background: #0b0b0b; border: 1px solid #222; }
.cur-preview img { width: 64px; height: 64px; }
.cur-preview small { flex-basis: 100%; text-align: center; color: #6f6f6f; font-size: 12px; }
.cur-sys.big { width: 64px; height: 64px; font-size: 44px; }
.cur-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.cur-grid .cur-opt { width: auto; }
.cur-any { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 4px; border-radius: 17px; border: 1px solid #333; background: #0b0b0b; color: #ccc; font-size: 13px; font-weight: 600; cursor: pointer; }
.cur-any input { width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
.cur-any input::-webkit-color-swatch-wrapper { padding: 0; }
.cur-any input::-webkit-color-swatch { border: 1px solid #555; border-radius: 50%; }
.cur-any.on, .cur-any:hover { border-color: #fff; color: #fff; }
.vx-dialog .modal-box:has(.cur-set) { max-width: 560px !important; }
.vx-dialog .modal-body:has(.cur-set) { max-height: min(70vh, 640px); overflow-y: auto; }

/* =================== pop-ups (Settings, Cursor, Movies...) in the site's black theme =================== */
.vx-dialog { align-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px; background: rgba(0, 0, 0, .72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.vx-dialog .modal-box { position: relative; background: #070707; border: 1px solid #262626; border-radius: 22px; box-shadow: 0 30px 80px rgba(0, 0, 0, .9); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; overflow: hidden; }
.vx-dialog .modal-head { padding: 20px 22px 8px; border-bottom: 0; }
.vx-dialog .modal-head h2 { font-size: 24px; font-weight: 800; letter-spacing: .5px; color: #fff; }
.vx-x { margin-left: auto; width: 38px; height: 38px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #2e2e2e; background: #111; color: #ccc; }
.vx-x:hover, .vx-x:focus-visible { border-color: #fff; color: #fff; }
.vx-x .ic { width: 18px; height: 18px; }
.vx-dialog .modal-body { padding: 10px 22px 6px; overflow-y: auto; color: #cfcfcf; }
.vx-dialog .modal-foot { padding: 14px 22px 20px; border-top: 0; }
.vx-dialog .modal-foot .btn { height: 44px; padding: 0 26px; border-radius: 22px; font-weight: 800; font-size: 15px; border: 1px solid #333; background: #111; color: #ddd; }
.vx-dialog .modal-foot .btn:hover { border-color: #fff; color: #fff; }
.vx-dialog .modal-foot .btn.primary { background: #fff; color: #000; border-color: #fff; }
.vx-dialog .modal-foot .btn.primary:hover { background: #dcdcdc; }
.vx-dialog .modal-foot .btn.danger { background: #ff3b3b; color: #fff; border-color: #ff3b3b; }
.vx-dialog .input { background: #0b0b0b; border: 1px solid #333; border-radius: 12px; color: #fff; }
.vx-dialog .input:focus { border-color: #fff; box-shadow: none; }
.vx-dialog label { color: #bdbdbd; }

/* Settings */
.st { display: flex; flex-direction: column; }
.st-lbl { margin: 14px 4px 8px; color: #6f6f6f; font-size: 11.5px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
.st-lbl:first-child { margin-top: 2px; }
.st-group { display: flex; flex-direction: column; border-radius: 16px; background: #0d0d0d; border: 1px solid #1f1f1f; overflow: hidden; }
.st-row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 10px 16px; border: 0; border-top: 1px solid #1a1a1a; background: none; color: #eee; font-size: 15px; font-weight: 600; text-align: left; text-decoration: none; transition: background-color .12s; }
.st-row:first-child { border-top: 0; }
.st-row:hover, .st-row:focus-visible { background: #161616; color: #fff; }
.st-row > .ic:first-child { width: 20px; height: 20px; flex: none; color: #8a8a8a; }
.st-row:hover > .ic:first-child { color: #fff; }
.st-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.st-t small { color: #6f6f6f; font-size: 12.5px; font-weight: 500; }
.st-pill { min-width: 28px; height: 24px; padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; background: #1f1f1f; color: #ddd; font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
.st-val { color: #8a8a8a; font-size: 13.5px; font-weight: 600; }
.st-chev { width: 18px; height: 18px; flex: none; color: #555; }
.st-row:hover .st-chev { color: #fff; }
.st-sw { position: relative; width: 48px; height: 28px; flex: none; border-radius: 14px; background: #2a2a2a; transition: background-color .15s; }
.st-sw i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #8a8a8a; transition: transform .18s ease, background-color .15s; }
.st-sw.on { background: #fff; }
.st-sw.on i { transform: translateX(20px); background: #000; }
.st-danger, .st-danger > .ic:first-child { color: #ff6b6b !important; }
.st-danger:hover { background: rgba(255, 59, 59, .1) !important; }
.st-note { margin: 16px 4px 2px; color: #6f6f6f; font-size: 12.5px; }
@media (max-width: 480px) { .vx-dialog { align-items: flex-end; padding: 0; } .vx-dialog .modal-box { max-width: none !important; border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); } }
/* little messages at the bottom, in the black theme */
.toast { background: #0b0b0b !important; border: 1px solid #2a2a2a !important; border-radius: 16px !important; color: #eee !important; box-shadow: 0 12px 30px rgba(0, 0, 0, .8) !important; }
.toast .ic { color: #fff !important; }

/* loading screen over a game until it arrives */
.ld { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 20px; background: #000; transition: opacity .3s ease; }
.ld.done { opacity: 0; pointer-events: none; }
.ld-in { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; max-width: 360px; }
.ld-spin { width: 44px; height: 44px; margin-bottom: 8px; border-radius: 50%; border: 3px solid #222; border-top-color: #fff; animation: ldSpin .8s linear infinite; }
@keyframes ldSpin { to { transform: rotate(360deg); } }
.ld b { color: #fff; font-size: 18px; font-weight: 800; }
.ld small { color: #8a8a8a; font-size: 13.5px; line-height: 1.45; }
.ld-acts { display: none; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; }
.ld.slow .ld-acts { display: flex; }
.ld-btn { height: 42px; padding: 0 20px; display: inline-flex; align-items: center; border-radius: 21px; border: 1px solid #333; background: #111; color: #ddd; font-weight: 700; font-size: 14px; }
.ld-btn:hover { border-color: #fff; color: #fff; }
.ld-btn.ld-main { background: #fff; color: #000; border-color: #fff; }
.ld-btn.ld-main:hover { background: #dcdcdc; }
@media (prefers-reduced-motion: reduce) { .ld-spin { animation-duration: 2.4s; } }

/* =================== VEXO home: side menu, script logo, search arrow, shortcut dock =================== */
html, body { background: #000; }
.vx-logo { font-family: "Kaushan Script", "Brush Script MT", "Segoe Script", cursive !important; font-weight: 400 !important; text-transform: none; letter-spacing: 1px !important; font-size: clamp(64px, 12vw, 120px) !important; line-height: 1.1 !important; }
.px-sub { margin-top: 2px; }

/* search bar with a round arrow button */
.px-search { padding-right: 8px; }
.px-go-btn { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: #fff; color: #000; display: inline-flex; align-items: center; justify-content: center; }
.px-go-btn:hover, .px-go-btn:focus-visible { background: #dcdcdc; }
.px-go-btn .ic { width: 18px; height: 18px; }
.px-search-wrap .px-kbd { display: none; }

/* shortcut dock */
.dock { display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; max-width: min(680px, 100%); margin: 22px auto 0; padding: 8px; border-radius: 32px; background: rgba(12, 12, 12, .85); border: 1px solid #1f1f1f; }
.dk { position: relative; width: 46px; height: 46px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid transparent; background: #151515; color: #d6d6d6; overflow: hidden; transition: background-color .15s, border-color .15s, transform .15s, color .15s; }
.dk:hover, .dk:focus-visible { background: #222; border-color: #fff; color: #fff; transform: translateY(-2px); }
.dk .ic { width: 20px; height: 20px; }
.dk img { position: absolute; inset: 11px; width: 24px; height: 24px; border-radius: 6px; }
.dk-letter { font-weight: 800; font-size: 17px; color: #fff; }
.dk-static:hover { transform: none; }
.dk-sep { width: 1px; height: 28px; background: #2a2a2a; margin: 0 2px; }
.dk.mu-on::after { content: none; }
.dk.mu-on { border-color: #fff; color: #fff; }

/* shortcuts editor */
.sc-set { display: flex; flex-direction: column; gap: 12px; }
.sc-help { margin: 0; color: #8a8a8a; font-size: 13.5px; }
.sc-list { display: flex; flex-direction: column; gap: 8px; }
.sc-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; background: #0d0d0d; border: 1px solid #1f1f1f; }
.sc-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sc-t b { color: #fff; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-t small { color: #6f6f6f; font-size: 12px; }
.sc-del { border: 1px solid #3a1d1d; background: none; color: #ff6b6b; border-radius: 14px; height: 30px; padding: 0 12px; font-size: 12.5px; font-weight: 700; }
.sc-del:hover { background: rgba(255, 59, 59, .12); }
.sc-empty { margin: 0; color: #6f6f6f; font-size: 13.5px; text-align: center; padding: 10px; }
.sc-add { display: flex; flex-wrap: wrap; gap: 8px; }
.sc-add .input { flex: 1 1 160px; min-width: 0; height: 42px; }
.sc-add-btn { height: 42px; padding: 0 20px; border-radius: 21px; border: 0; background: #fff; color: #000; font-weight: 800; }
.sc-add-btn:hover { background: #dcdcdc; }

/* side menu (computers and Chromebooks) */
.sb { display: none; }
@media (min-width: 900px) {
  .sb { position: fixed; z-index: 55; top: 0; left: 0; bottom: 0; width: 230px; display: flex; flex-direction: column; gap: 6px; padding: 18px 14px; background: #000; border-right: 1px solid #161616; }
  .sb-logo { display: block; padding: 0 12px 14px; color: #fff; font-family: "Kaushan Script", "Brush Script MT", cursive; font-size: 40px; line-height: 1.1; }
  .sb-nav { display: flex; flex-direction: column; gap: 4px; }
  .sb-bottom { margin-top: auto; }
  .sb-item { display: flex; align-items: center; gap: 14px; height: 44px; padding: 0 14px; border-radius: 22px; color: #bdbdbd; font-size: 15px; font-weight: 600; transition: background-color .12s, color .12s; }
  .sb-item .ic { width: 20px; height: 20px; flex: none; }
  .sb-item:hover, .sb-item:focus-visible { background: #111; color: #fff; }
  .sb-item.on { background: #fff; color: #000; }
  .sb-item.mu-on { color: #fff; background: #151515; }
  .sb-item.mu-on::after { content: " ♪"; margin-left: -6px; }
  body.has-sb .topbar { left: 230px; }
  body.has-sb .topbar .brand, body.has-sb .topbar .hdr-link[data-music], body.has-sb .topbar .hdr-link[data-movies], body.has-sb .topbar .hdr-link[data-settings] { display: none; }
  body.has-sb main, body.has-sb .site-footer { margin-left: 230px !important; }
  body.has-sb main { max-width: none; padding-left: 36px; padding-right: 36px; }
  body.has-sb .mu-sp { right: 16px; }
}
/* =================== Games page, Music page and the music bar =================== */
.pg-head { display: flex; align-items: baseline; gap: 14px; margin: 18px 0 14px; }
.pg-head h1 { margin: 0; font-size: 34px; font-weight: 800; color: #fff; }
.pg-head span { color: #6f6f6f; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }

body.on-home .site-footer { display: none; }
body.on-home main { min-height: calc(100vh - 80px); display: flex; flex-direction: column; justify-content: center; }
body.on-home .px-hero { padding-top: 0; }
.hdr-games { display: none; }
@media (max-width: 899px) { .hdr-games { display: inline-flex; } }

/* Music page */
.mp { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 0; margin-top: 14px; min-height: calc(100vh - 140px); border: 1px solid #1c1c1c; border-radius: 20px; background: rgba(6, 6, 6, .92); overflow: hidden; }

.mp-navs, .mp-pls { display: flex; flex-direction: column; gap: 4px; }
.mp-nav { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: none; color: #bdbdbd; font-size: 15px; font-weight: 600; text-align: left; }
.mp-nav .ic { width: 20px; height: 20px; flex: none; }
.mp-nav span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mp-nav:hover { background: #111; color: #fff; }

.mp-empty { margin: 8px 14px; color: #6f6f6f; font-size: 13px; }

.mp-main { min-width: 0; padding: 22px 26px 30px; }
.mp-top { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.mp-top h2 { margin: 0 auto 0 0; color: #fff; font-size: 24px; font-weight: 800; }
.mp-count { color: #6f6f6f; font-size: 13px; font-weight: 700; }
.mp-row { margin-bottom: 26px; }

.mp-tiles { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }

/* ---------- animated countdown (rolling digits, shine + ring every second, reflection) ----------
   Smooth: only transform and opacity animate; the reflection is a mirrored copy, not a live mirror. */
.cd { display: flex; justify-content: center; gap: 10px; margin-bottom: 58px; }
.cd-cell { position: relative; display: flex; }
.cd-seg, .cd-ref { display: flex; flex-direction: column; align-items: center; min-width: 78px; padding: 12px 10px 9px; border-radius: 14px;
  background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 50%, #050505 100%); border: 1px solid #2e2e2e; }
.cd-seg { position: relative; overflow: hidden; contain: layout paint; isolation: isolate; }
.cd-cell.is-sec .cd-seg, .cd-cell.is-sec .cd-ref { border-color: #3a3a3a; }
.cd-ref { position: absolute; left: 0; right: 0; top: calc(100% + 5px); transform: scaleY(-1); opacity: .2; pointer-events: none;
  -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 55%); mask-image: linear-gradient(to top, #000 0%, transparent 55%); }
.cd-seg::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0)); pointer-events: none; }
.cd-seg::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%; opacity: 0; pointer-events: none;
  transform: translate3d(-150%, 0, 0) skewX(-18deg); background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.28), rgba(255,255,255,0)); }
.cd-ring { position: absolute; inset: 0; border-radius: inherit; border: 1px solid #9a9a9a; opacity: 0; pointer-events: none; }
.cd-cell[data-t="a"] .cd-seg::after { animation: cdShineA .75s ease-out; }
.cd-cell[data-t="b"] .cd-seg::after { animation: cdShineB .75s ease-out; }
.cd-cell[data-t="a"] .cd-ring { animation: cdRingA .5s ease-out; }
.cd-cell[data-t="b"] .cd-ring { animation: cdRingB .5s ease-out; }
.cd-num { position: relative; display: flex; }
.cd-num::after { content: ""; position: absolute; left: -6px; right: -6px; top: 50%; height: 1px; background: rgba(0,0,0,.55); box-shadow: 0 1px 0 rgba(255,255,255,.05); }
.cd-dg { position: relative; display: inline-block; width: .64em; height: 1.12em; overflow: hidden; color: #fff; font-size: 36px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; perspective: 300px; }
.cd-dg i { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; backface-visibility: hidden; }
.cd-dg i.o { animation: cdOut .45s cubic-bezier(.55,0,.75,.2) forwards; will-change: transform, opacity; }
.cd-dg i.n { animation: cdIn .55s cubic-bezier(.2,1.35,.35,1) both; will-change: transform, opacity; }
.cd-seg small, .cd-ref small { margin-top: 6px; color: #8a8a8a; font-size: 10.5px; font-weight: 800; letter-spacing: 2px; }
@keyframes cdIn { 0% { transform: translate3d(0, 95%, 0) scale(.8) rotateX(-60deg); opacity: 0; } 100% { transform: translate3d(0, 0, 0); opacity: 1; } }
@keyframes cdOut { 0% { transform: translate3d(0, 0, 0); opacity: 1; } 100% { transform: translate3d(0, -95%, 0) scale(.8) rotateX(60deg); opacity: 0; } }
@keyframes cdShineA { 0% { transform: translate3d(-150%, 0, 0) skewX(-18deg); opacity: 1; } 100% { transform: translate3d(340%, 0, 0) skewX(-18deg); opacity: 0; } }
@keyframes cdShineB { 0% { transform: translate3d(-150%, 0, 0) skewX(-18deg); opacity: 1; } 100% { transform: translate3d(340%, 0, 0) skewX(-18deg); opacity: 0; } }
@keyframes cdRingA { 0% { opacity: .9; } 100% { opacity: 0; } }
@keyframes cdRingB { 0% { opacity: .9; } 100% { opacity: 0; } }
.cd-lg .cd-dg { font-size: clamp(30px, 6vw, 46px); }
.cd-lg .cd-seg, .cd-lg .cd-ref { min-width: clamp(64px, 14vw, 96px); padding: 14px 10px 10px; }
.cd-sm { justify-content: flex-start; gap: 7px; margin-bottom: 34px; }
.cd-sm .cd-seg, .cd-sm .cd-ref { min-width: 50px; padding: 8px 6px 6px; border-radius: 10px; }
.cd-sm .cd-ref { top: calc(100% + 3px); opacity: .15; }
.cd-sm .cd-dg { font-size: 22px; }
.cd-sm .cd-seg small, .cd-sm .cd-ref small { font-size: 9px; letter-spacing: 1.5px; margin-top: 4px; }
@media (max-width: 600px) { .cd { gap: 7px; } .cd-lg .cd-cell { flex: 1; } .cd-lg .cd-seg { flex: 1; min-width: 0; } .cd-lg .cd-ref { min-width: 0; } }
@media (prefers-reduced-motion: reduce) { .cd-seg::after, .cd-ring, .cd-dg i.o, .cd-dg i.n { animation: none !important; } }

.xp-float { position: fixed; right: 18px; bottom: 18px; z-index: 99980; padding: 6px 12px; border-radius: 999px; background: #fff; color: #000; font-size: 13px; font-weight: 800; opacity: 0; transform: translateY(10px); pointer-events: none; }

.me-info { flex: 1; min-width: 0; }
